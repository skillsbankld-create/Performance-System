function renderDashboard(isEmployeeView){
  const mf = getMonthFilter('dashboard');
  const totalTasks = state.tasks.length;
  const openTasks = state.tasks.filter(t=>t.status==='open').length;
  const doneTasks = state.tasks.filter(t=>t.status==='done' && inMonthFilter(t.completedDate, mf));
  const onTimeAll = doneTasks.filter(t=>computeTaskHoursDiff(t)>=0).length;
  const onTimeRateAll = doneTasks.length? Math.round((onTimeAll/doneTasks.length)*100) : null;
  const teamMonthNet = teamMonthNetFor(mf);
  const reviewsInScope = state.qualityReviews.filter(r=>inMonthFilter(r.date, mf));
  const teamQuality = reviewsInScope.length? Math.round(reviewsInScope.reduce((s,r)=>s+r.pct,0)/reviewsInScope.length) : null;
  const auditsInScope = state.complianceAudits.filter(a=>inMonthFilter(`${a.year}-${String(a.month).padStart(2,'0')}-01`, mf));
  const latestAudit = auditsInScope.slice().sort((a,b)=>new Date(b.year,b.month)-new Date(a.year,a.month))[0];

  const recentHours = doneTasks
    .slice().sort((a,b)=> new Date(a.completedDate)-new Date(b.completedDate))
    .slice(-24).map(t=>computeTaskHoursDiff(t));
  const maxAbs = Math.max(1, ...recentHours.map(v=>Math.abs(v)));

  const openTasksArr = state.tasks.filter(t=>t.status==='open'); // always shown, regardless of the month filter
  const pendingApprovalCount = state.tasks.filter(t=>t.status==='pending_approval').length; // also always current, needs action now
  const openOverdueCount = openTasksArr.filter(t=>dayDiff(t.deadline, todayStr())<0).length;
  const openOnTrackCount = openTasksArr.length - openOverdueCount;
  const taskStatusSegments = [
    {label:'Completed', value:doneTasks.length, color:'var(--teal)'},
    {label:'Pending approval', value:pendingApprovalCount, color:'var(--indigo)'},
    {label:'On track', value:openOnTrackCount, color:'var(--amber)'},
    {label:'Overdue', value:openOverdueCount, color:'var(--rose)'},
  ];
  const onTimeSegments = [
    {label:'On-time', value:onTimeAll, color:'var(--teal)'},
    {label:'Late', value: doneTasks.length-onTimeAll, color:'var(--rose)'},
  ];
  const recentShoutouts = state.shoutouts.filter(s=>inMonthFilter(s.date, mf)).slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);

  return `
    ${renderGreetingBanner()}
    ${renderAnnouncementBanner()}
    ${renderPipelineNotificationBanner()}
    ${renderAnnouncementComposer()}

    ${renderEomCard(isEmployeeView)}

    <div class="page-head">
      <div><h1>Team Dashboard</h1><p>A live snapshot of how the team is performing${mf==='all'?' — all time':` — ${monthFilterLabel(mf)}`}. Open/pending tasks always show, regardless of the month below.</p></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${renderMonthFilterControl('dashboard')}
        ${isEmployeeView? '' : `<button class="btn btn-primary" data-open="add-task">+ Assign New Task</button>`}
      </div>
    </div>

    ${renderQuarterAchievementRow(false)}

    <div class="kpi-row">
      <div class="kpi indigo"><div class="lbl">Team members</div><div class="val">${state.employees.length}</div></div>
      <div class="kpi amber"><div class="lbl">Open tasks</div><div class="val">${openTasks}</div></div>
      <div class="kpi"><div class="lbl">Completed tasks</div><div class="val">${doneTasks.length}</div></div>
      <div class="kpi teal"><div class="lbl">On-time rate</div><div class="val">${onTimeRateAll===null?'—':onTimeRateAll+'<small>%</small>'}</div></div>
      <div class="kpi ${teamMonthNet>0?'teal':teamMonthNet<0?'rose':''}"><div class="lbl">Team time balance</div><div class="val" style="font-size:19px">${teamMonthNet>0?'+':''}${fmtHours(teamMonthNet)} <small>${teamMonthNet>0?'Buffer':teamMonthNet<0?'Shrinkage':''}</small></div></div>
      <div class="kpi"><div class="lbl">Avg quality score</div><div class="val">${teamQuality===null?'—':teamQuality+'<small>%</small>'}</div></div>
      <div class="kpi"><div class="lbl">Latest compliance</div><div class="val">${latestAudit?latestAudit.overallPct+'<small>%</small>':'—'}</div></div>
    </div>

    ${renderLxdProcessCard()}

    <div class="card accent-amber">
      <h3>Unit workload heat map</h3>
      <p class="hint">The whole team's committed hours vs. total capacity (${WEEKLY_CAPACITY_HOURS}h × ${state.employees.length} member${state.employees.length===1?'':'s'} per week) — how loaded is the unit as a whole, week by week. Always shows the current weeks, regardless of the month filter above.</p>
      ${renderTeamWorkloadHeatmap(6)}
    </div>

    ${renderTriggersCard(isEmployeeView)}

    <div class="pulse-wrap">
      <div class="pulse-top">
        <div class="pulse-title"><span class="live"></span> Team Pulse</div>
        <div class="pulse-status">Last ${recentHours.length} deliveries${recentHours.length? (onTimeRateAll>=80?' · steady rhythm':onTimeRateAll<50?' · high variance — worth a look':' · moderate rhythm') : ''}</div>
      </div>
      ${recentHours.length? `
        <div class="pulse-bars">
          <div class="pulse-sweep"></div>
          ${recentHours.map(v=>{
            const h = 8 + Math.round((Math.abs(v)/maxAbs)*56);
            const color = v>0? 'var(--teal)' : v<0? 'var(--rose)' : 'var(--text-faint)';
            return `<div class="pulse-bar" style="height:${h}px;background:${color}"></div>`;
          }).join('')}
        </div>
      ` : `<div class="pulse-empty">Not enough completed tasks yet to draw the pulse. Complete a task to start tracking.</div>`}
    </div>

    <div class="card accent-indigo">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <h3 style="margin:0">🦸 Heroes Rank</h3>
        ${renderMonthFilterControl('heroes-rank')}
      </div>
      <p class="hint">The all-in-all leaderboard — blends Commitment (attendance + delivery-deadline reliability), Quality of Work, Recognition, Growth &amp; Contribution, and Effort Delivered (real hours completed) into one score out of 100, scoped to ${getMonthFilter('heroes-rank')==='all'?'year-to-date ('+new Date().getFullYear()+')':monthFilterLabel(getMonthFilter('heroes-rank'))}. The bars below show relative strength in each area — exact figures and the full breakdown are available to the Team Lead and Admin on the Team page.</p>
      ${heroesRanking(getMonthFilter('heroes-rank')==='all'?'ytd':getMonthFilter('heroes-rank')).length? `
        <table>
          <thead><tr><th>#</th><th>Member</th><th>Commitment</th><th>Quality</th><th>Recognition</th><th>Growth</th><th>Effort</th><th>Heroes Score</th></tr></thead>
          <tbody>
            ${heroesRanking(getMonthFilter('heroes-rank')==='all'?'ytd':getMonthFilter('heroes-rank')).map((h,i)=>{
              const rankCls = i===0?'gold':i===1?'silver':i===2?'bronze':'';
              const clickable = !isEmployeeView || (session && session.employeeId===h.emp.id);
              const scoreCls = h.score.total>=80?'pos':h.score.total>=60?'zero':'neg';
              return `<tr ${clickable?`class="rowlink" data-goto-employee="${h.emp.id}"`:''}>
                <td><span class="rank ${rankCls}">${i+1}</span></td>
                <td><div class="who">
                    ${avatarHTML(h.emp)}
                    <div><div class="nm">${escapeHtml(h.emp.name)}${hasRecognition(h.emp.id)?' 🏅':''}</div><div class="rl">${escapeHtml(h.emp.role||'—')}</div></div>
                  </div></td>
                <td>${miniScoreBar(h.score.timeScore,'indigo')}</td>
                <td>${miniScoreBar(h.score.qualityOfWorkScore,'teal')}</td>
                <td>${miniScoreBar(h.score.recognitionScore,'rose')}</td>
                <td>${miniScoreBar(h.score.growthScore,'amber')}</td>
                <td>${miniScoreBar(h.score.effortScore,'indigo')}</td>
                <td><span class="badge ${scoreCls}">${h.score.total} / 100</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : emptyState('◍','No team members yet','Add your first team member from the Team page.')}
    </div>

    <div class="card accent-rose">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:${ui.showAddShoutout?'16px':'0'}">
        <div><h3 style="margin:0">High Fives</h3><p class="hint" style="margin:2px 0 0">A quick thank-you for a colleague — visible to the whole team.</p></div>
        <button class="btn btn-ghost btn-sm" id="btn-add-shoutout">${ui.showAddShoutout?'Close form':'+ Give a high five'}</button>
      </div>
      ${ui.showAddShoutout? renderShoutoutForm() : ''}
      ${recentShoutouts.length? `
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:${ui.showAddShoutout?'16px':'0'}">
          ${recentShoutouts.map(s=>`
            <div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(37,48,83,.5)">
              <span style="font-size:16px;flex:0 0 auto">🙌</span>
              <div style="font-size:13.5px">
                <b>${escapeHtml(s.fromLabel)}</b> → <b>${escapeHtml(employeeById(s.toEmployeeId)?.name||'—')}</b>
                <div style="color:var(--text-dim);margin-top:2px">${escapeHtml(s.message)}</div>
                <div style="color:var(--text-faint);font-size:11px;margin-top:2px">${fmtDate(s.date)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      ` : `<div class="empty-state" style="padding-top:${ui.showAddShoutout?'16px':'20px'}">No high fives yet — be the first to recognize a teammate.</div>`}
    </div>
  `;
}
function renderShoutoutForm(){
  const others = session.role==='employee'? state.employees.filter(e=>e.id!==session.employeeId) : state.employees;
  if(!others.length) return `<div class="inline-form">No teammates to shout out yet.</div>`;
  return `
    <div class="inline-form" style="display:block">
      <p class="hint" style="margin:0 0 10px">You get one High Five to give per month — make it count.</p>
      <div class="form-grid">
        <div><label>To</label><select id="so-to">${others.map(e=>`<option value="${e.id}">${escapeHtml(e.name)}</option>`).join('')}</select></div>
      </div>
      <div style="margin-top:10px"><label>Reason <span style="color:var(--text-faint)">(required)</span></label><textarea id="so-message" rows="2" placeholder="What did they do that deserves a high five?">${escapeHtml(taVal('so-message',''))}</textarea></div>
      <div class="form-actions">
        <button class="btn btn-primary btn-sm" id="btn-send-shoutout">Send</button>
        <button class="btn btn-ghost btn-sm" id="btn-cancel-shoutout">Cancel</button>
      </div>
    </div>
  `;
}

/* ============ TASKS ============ */
function renderTasks(){
  const mf = getMonthFilter('tasks');
  const open = state.tasks.filter(t=>t.status==='open').sort((a,b)=> new Date(a.deadline)-new Date(b.deadline));
  const pending = state.tasks.filter(t=>t.status==='pending_approval').sort((a,b)=> new Date(b.completedDate)-new Date(a.completedDate));
  const done = state.tasks.filter(t=>t.status==='done' && inMonthFilter(t.completedDate, mf)).sort((a,b)=> new Date(b.completedDate)-new Date(a.completedDate));

  return `
    <div class="page-head">
      <div><h1>Tasks</h1><p>Assign, track, and close out tasks — Buffering/Shrinkage Time updates automatically once approved. Completed log below is scoped to ${mf==='all'?'all time':monthFilterLabel(mf)}; open/pending always show.</p></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        ${renderMonthFilterControl('tasks')}
        <button class="btn btn-primary" id="btn-add-task">+ Assign New Task</button>
      </div>
    </div>

    <div id="add-task-slot">${ui.showAddTask ? addTaskForm() : ''}</div>

    <div class="card accent-amber">
      <h3>Open tasks (${open.length})</h3>
      <p class="hint">Click "Mark delivered" to log the actual delivery date, or reassign directly from the dropdown. "Edit" opens full details.</p>
      ${open.length? `
        <table>
          <thead><tr><th>Task</th><th>Type</th><th>Assignee</th><th>Agreed deadline</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${open.map(t=>{
              const overdue = dayDiff(t.deadline, todayStr()) < 0;
              return `<tr>
                <td><b>${escapeHtml(t.title)}</b>${taskMeta(t)}</td>
                <td><span class="tag">${escapeHtml(typeById(t.typeId)?.name||'—')}</span>${taskModeLabel(t)?` <span class="tag">${escapeHtml(taskModeLabel(t))}</span>`:''}${t.stretch?' <span class="badge pos" title="Above this member\'s current title">★ Stretch</span>':''}</td>
                <td>
                  <select class="reassign-select" data-task="${t.id}">
                    ${state.employees.map(e=>`<option value="${e.id}" ${e.id===t.assigneeId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}
                  </select>
                </td>
                <td>${fmtDate(t.deadline)}</td>
                <td><span class="status-pill ${overdue?'overdue':'open'}">${overdue?'Overdue':'In progress'}</span>${t.paused?` <span class="badge amber" title="Paused ${fmtDate(t.pausedAt)} → planned resume ${fmtDate(t.plannedResumeAt)}${t.pauseReason?` — reason: ${(PAUSE_REASONS.find(r=>r.value===t.pauseReason)||{}).label||t.pauseReason}${t.pauseReasonNote?`: ${t.pauseReasonNote}`:``}`:``}">⏸ Paused</span>`:''}</td>
                <td style="white-space:nowrap">
                  ${ui.pausingTask===t.id ? `
                    <div class="inline-form">
                      <div><label>Pausing from</label><input type="date" id="pause-from-${t.id}" value="${todayStr()}"></div>
                      <div><label>Will resume on</label><input type="date" id="pause-to-${t.id}" value="${todayStr()}"></div>
                      <div><label>Reason for pausing</label>
                        <select id="pause-reason-${t.id}">${PAUSE_REASONS.map(r=>`<option value="${r.value}">${escapeHtml(r.label)}</option>`).join('')}</select>
                      </div>
                      <div id="pause-reason-other-wrap-${t.id}" style="display:none;flex:1;min-width:180px">
                        <label>Please specify</label><input type="text" id="pause-reason-other-${t.id}" placeholder="e.g. waiting on...">
                      </div>
                      <button class="btn btn-primary btn-sm" data-confirm-pause="${t.id}">Confirm pause</button>
                      <button class="btn btn-ghost btn-sm" data-cancel-pause="${t.id}">Cancel</button>
                      <div id="pause-warn-${t.id}" class="hint" style="width:100%;margin-top:2px"></div>
                    </div>
                  ` : ui.completingTask===t.id ? `
                    <div class="inline-form">
                      <div><label>Actual delivery date</label><input type="date" id="complete-date-${t.id}" value="${todayStr()}"></div>
                      <div style="flex:1;min-width:180px"><label>Reason if late <span style="color:var(--text-faint)">(optional)</span></label><input type="text" id="complete-reason-${t.id}" placeholder="e.g. client feedback delayed"></div>
                      ${deliveryDraftFieldsHtml(t)}
                      <button class="btn btn-primary btn-sm" data-confirm-complete="${t.id}">Confirm</button>
                      <button class="btn btn-ghost btn-sm" data-cancel-complete="${t.id}">Cancel</button>
                    </div>
                  ` : `<button class="btn btn-ghost btn-sm" data-start-complete="${t.id}">Mark delivered</button>
                    ${t.paused? `<button class="btn btn-ghost btn-sm" data-clear-pause="${t.id}">Resume now</button>` : `<button class="btn btn-ghost btn-sm" data-start-pause="${t.id}">Pause</button>`}
                    <button class="btn btn-ghost btn-sm" data-start-edit="${t.id}">Edit</button>
                    <button class="btn btn-danger btn-sm" data-delete-task="${t.id}">Delete</button>`}
                </td>
              </tr>${ui.editingTask===t.id? editTaskFormRow(t) : ''}`;
            }).join('')}
          </tbody>
        </table>
      ` : emptyState('▤','No open tasks','Assign a new task to any team member to get started.')}
    </div>

    <div class="card accent-indigo">
      <h3>Awaiting your approval (${pending.length})</h3>
      <p class="hint">Delivered by the assignee — log a quality review and approve on the Approvals page before it counts as done.</p>
      ${pending.length? `
        <table>
          <thead><tr><th>Task</th><th>Assignee</th><th>Delivered on</th><th></th></tr></thead>
          <tbody>
            ${pending.map(t=>`<tr>
              <td>${escapeHtml(t.title)}${taskMeta(t)}</td>
              <td>${escapeHtml(employeeById(t.assigneeId)?.name||'—')}</td>
              <td>${fmtDate(t.completedDate)}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-ghost btn-sm" data-start-edit="${t.id}">Edit</button>
                <button class="btn btn-danger btn-sm" data-delete-task="${t.id}">Delete</button>
              </td>
            </tr>${ui.editingTask===t.id? editTaskFormRow(t, 4) : ''}`).join('')}
          </tbody>
        </table>
      ` : emptyState('✓','Nothing waiting on you','Delivered tasks needing review will show up here.')}
    </div>

    <div class="card accent-teal">
      <h3>Completed task log (${done.length})</h3>
      ${done.length? `
        <table>
          <thead><tr><th>Task</th><th>Assignee</th><th>Agreed deadline</th><th>Actual delivery</th><th>Result</th><th></th></tr></thead>
          <tbody>
            ${done.slice(0,200).map(t=>{
              const hrs = computeTaskHoursDiff(t);
              const rawDays = businessDayDiff(t.deadline, t.completedDate);
              const label = rawDays>0? `${rawDays} day${rawDays===1?'':'s'} early` : rawDays<0? `${Math.abs(rawDays)} day${Math.abs(rawDays)===1?'':'s'} late` : 'right on deadline';
              return `<tr>
                <td>${escapeHtml(t.title)}${taskMeta(t)}${t.delayReason?`<div style="font-size:11.5px;color:var(--text-faint);margin-top:2px">Reason: ${escapeHtml(t.delayReason)}</div>`:''}</td>
                <td>${escapeHtml(employeeById(t.assigneeId)?.name||'—')}</td>
                <td>${fmtDate(t.deadline)}</td>
                <td>${fmtDate(t.completedDate)}</td>
                <td>${timeBalanceBadge(hrs)} <span class="tag">${label}</span>${t.stretch?' <span class="badge pos">★ Stretch</span>':''}</td>
                <td style="white-space:nowrap">
                  <button class="btn btn-ghost btn-sm" data-start-edit="${t.id}">Edit</button>
                  <button class="btn btn-danger btn-sm" data-delete-task="${t.id}">Delete</button>
                </td>
              </tr>${ui.editingTask===t.id? editTaskFormRow(t, 6) : ''}`;
            }).join('')}
          </tbody>
        </table>
        ${done.length>200? `<p class="hint" style="margin-top:8px">Showing the most recent 200 of ${done.length}. Pick a specific month above to narrow this down.</p>` : ''}
      ` : emptyState('✓','No completed tasks yet','The first delivered task will show up here with its points.')}
    </div>

    <div class="card accent-indigo">
      <h3>Reference: standard time &amp; typical lead by deliverable type</h3>
      <p class="hint">From the LDU Standard Time Estimation Reference and Work Allocation guide — informational only, the Team Leader always makes the final call.</p>
      <table>
        <thead><tr><th>Deliverable type</th><th>Standard duration</th><th>Typical lead</th></tr></thead>
        <tbody>
          ${state.taskTypes.map(tt=>`<tr>
            <td>${escapeHtml(tt.name)}</td>
            <td style="color:var(--text-dim);font-size:12.5px">${tt.modes.map(m=>`${escapeHtml(m.label)}: ${escapeHtml(m.range)}`).join('<br>')}</td>
            <td style="color:var(--text-dim)">${tt.lead?escapeHtml(tt.lead):'—'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

  return `
    <tr>
      <td colspan="${colspan}" style="background:var(--surface-2)">
        <div class="inline-form" style="display:block;border:none;background:transparent">
          <p class="hint" style="margin:0 0 12px">Edit any detail of this task, including its status — changes apply immediately and recalculate everywhere.</p>
          <div class="form-grid">
            <div><label>Task name</label><input type="text" id="et-title-${t.id}" value="${escapeHtml(t.title)}"></div>
            <div><label>Deliverable type</label>
              <select id="et-type-${t.id}">${state.taskTypes.map(tt=>`<option value="${tt.id}" ${tt.id===t.typeId?'selected':''}>${escapeHtml(tt.name)}</option>`).join('')}</select>

            <div><label>Mode</label>
              <select id="et-mode-${t.id}">${type.modes.map(m=>`<option value="${m.key}" ${m.key===t.mode?'selected':''}>${escapeHtml(m.label)} — ${escapeHtml(m.range)}</option>`).join('')}</select>

            <div><label>Assignee</label>
              <select id="et-assignee-${t.id}">${state.employees.map(e=>`<option value="${e.id}" ${e.id===t.assigneeId?'selected':''}>${escapeHtml(e.name)}</option>`).join('')}</select>

            <div><label>Status</label>
              <select id="et-status-${t.id}">

            </div>
            <div><label>Start date</label><input type="date" id="et-start-${t.id}" value="${t.assignedDate||''}"></div>

            <div><label>Actual delivery date <span style="color:var(--text-faint)">(if delivered)</span></label><input type="date" id="et-completed-${t.id}" value="${t.completedDate||''}"></div>
            <div><label>Client name</label><input type="text" id="et-client-${t.id}" value="${escapeHtml(t.client||'')}"></div>
            <div><label>BD</label><select id="et-bdunit-${t.id}"><option value="">—</option>${BD_OPTIONS.map(o=>`<option value="${o}" ${t.bdUnit===o?'selected':''}>${o}</option>`).join('')}</select></div>
            <div><label>Language</label><select id="et-language-${t.id}"><option value="">—</option>${LANGUAGE_OPTIONS.map(o=>`<option value="${o}" ${t.language===o?'selected':''}>${o}</option>`).join('')}</select></div>
            <div><label>Topic Type</label><select id="et-topictype-${t.id}"><option value="">—</option>${TOPIC_TYPE_OPTIONS.map(o=>`<option value="${o}" ${t.topicType===o?'selected':''}>${o}</option>`).join('')}</select></div>
            <div><label style="display:flex;align-items:center;gap:6px;margin-top:22px"><input type="checkbox" id="et-stretch-${t.id}" ${t.stretch?'checked':''}> Flag as stretch assignment</label></div>
          </div>
          <div style="margin-top:10px"><label>Slack delivery time <span style="color:var(--text-faint)">(agreed date &amp; time for sharing on Slack)</span></label><input type="datetime-local" id="et-slack-${t.id}" value="${t.slackDeliveryTime||''}"></div>
          <div style="margin-top:10px"><label>Reason if late <span style="color:var(--text-faint)">(optional)</span></label><input type="text" id="et-reason-${t.id}" value="${escapeHtml(t.delayReason||'')}"></div>
          <div style="margin-top:10px"><label>Comment / Task Summary</label><textarea id="et-summary-${t.id}" rows="2">${escapeHtml(taVal('et-summary-'+t.id, t.summary||''))}</textarea></div>
          <div class="form-actions">
            <button class="btn btn-primary btn-sm" data-save-edit="${t.id}">Save changes</button>
            <button class="btn btn-ghost btn-sm" data-cancel-edit="${t.id}">Cancel</button>
          </div>
        </div>
      </td>
    </tr>
  `;

function taskModeLabel(t){
  const type = typeById(t.typeId);
  if(!type || !t.mode) return '';
  const mode = type.modes.find(m=>m.key===t.mode);
  return mode? mode.label : '';
}
function taskMeta(t){
  const bits = [];
  if(t.client) bits.push('Client: '+escapeHtml(t.client));
  if(t.bdUnit) bits.push('BD: '+escapeHtml(t.bdUnit));
  if(t.language) bits.push('Language: '+escapeHtml(t.language));
  if(t.topicType) bits.push('Topic: '+escapeHtml(t.topicType));
  const line1 = bits.length? `<div style="font-size:11.5px;color:var(--text-faint);margin-top:2px">${bits.join(' · ')}</div>` : '';
  const line2 = t.summary? `<div style="font-size:11.5px;color:var(--text-faint);margin-top:2px">${escapeHtml(t.summary)}</div>` : '';
  return line1+line2;
}

          <tbody>

            </tr>`).join('')}
          </tbody>
        </table>
      ` : `<div class="empty-state" style="padding-top:20px">Nothing logged yet.</div>`}
    </div>

    <div class="card accent-teal">
      <h3>Leave &amp; capacity this week</h3>
      <p class="hint">Every approved leave, sickness, late/early, or comp day currently reducing the team's available hours — so nothing catches you off guard.</p>
      ${(()=>{
        const w = computeWeekBuckets(1)[0];
        const onLeave = state.employees.map(e=>({e, hrs: employeeLeaveHoursInWeek(e.id, w.start, w.end)})).filter(x=>x.hrs>0);
        const teamCapacity = state.employees.reduce((s,e)=>s+WEEKLY_CAPACITY_HOURS,0);
        const teamLost = onLeave.reduce((s,x)=>s+x.hrs,0);
        const pctLost = teamCapacity>0? Math.round((teamLost/teamCapacity)*100) : 0;
        return `
          <p style="font-size:13.5px;margin:0 0 14px">
            ${onLeave.length? `<b>${onLeave.length}</b> team member${onLeave.length===1?'':'s'} affected this week — team capacity reduced by <b>${pctLost}%</b> (${Math.round(teamLost*10)/10}h of ${teamCapacity}h).`
              : 'No approved leave, sickness, or late/early affecting this week — full team capacity available.'}

          ${onLeave.length? `
            <table>
              <thead><tr><th>Member</th><th>Hours affected this week</th></tr></thead>
              <tbody>
                ${onLeave.map(x=>`<tr>
                  <td><div class="who">${avatarHTML(x.e)}<div class="nm">${escapeHtml(x.e.name)}</div></div></td>
                  <td><span class="tag">🏖 ${Math.round(x.hrs*10)/10}h</span></td>
                </tr>`).join('')}
              </tbody>
            </table>
          ` : ''}
        `;
      })()}
    </div>

    <div class="card accent-rose">
      <h3>Workload heat map — estimated hours</h3>
      <p class="hint">Estimated hours of open work due each week, per member — the darker the cell, the closer that member is to (or past) their capacity for that week. 🏖 marks a week with approved leave, where capacity is automatically reduced.</p>
      ${renderWorkloadHeatmap(6, (empId,w)=>{
        const hrs = tasksInWeek(empId,w.start,w.end).reduce((s,t)=>s+taskEstimatedHours(t),0);
        return Math.round(hrs*10)/10;
      }, {suffix:'h', leaveAware:true})}
    </div>

    <div class="card accent-amber">
      <h3>Workload vs. capacity</h3>
      <p class="hint">Estimated hours of open work per member, against a standard ${WEEKLY_CAPACITY_HOURS}h working week — for planning who can take on more, and who can't.</p>
      ${state.employees.length? `
        <table>
          <thead><tr><th>Member</th><th>Open tasks</th><th>Est. hours queued</th><th>Weeks of backlog</th><th>Status</th></tr></thead>
          <tbody>
            ${state.employees.map(e=>{
              const openCount = tasksFor(e.id).filter(t=>t.status==='open').length;
              const hrs = employeeWorkloadHours(e.id);
              const weeks = employeeWorkloadWeeks(e.id);
              const status = workloadStatus(weeks);
              return `<tr>
                <td><div class="who">${avatarHTML(e)}<div class="nm">${escapeHtml(e.name)}</div></div></td>
                <td>${openCount}</td>
                <td>${Math.round(hrs*10)/10}h</td>
                <td>${weeks.toFixed(1)}</td>
                <td><span class="badge ${status.cls}">${status.label}</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      ` : emptyState('◍','No team members yet','Add your first team member above.')}
    </div>
  `;
}

  const monthsInTier = e.tierStartDate ? monthsBetween(e.tierStartDate, todayStr()) : null;

                  ${a.dueDate? `<span class="tag" style="${overdue?'background:var(--rose-dim);color:var(--rose)':''}">due ${fmtDate(a.dueDate)}</span>` : ''}

              }).join('')}
            </div>
          ` : ''}
        </div>
      `).join('') : `<div class="empty-state" style="padding-top:16px">No 1:1s logged yet.</div>`}

function renderHeroesScoreSummaryCard(emp){
  const s = computeHeroesScore(emp.id);
  const categories = [
    {label:'Commitment', score:s.timeScore, weight:s.weights.time},
    {label:'Quality of Work', score:s.qualityOfWorkScore, weight:s.weights.quality+s.weights.monitor+s.weights.satisfaction+s.weights.delivery},
    {label:'Recognition', score:s.recognitionScore, weight:s.weights.recognition},
    {label:'Growth & Contribution', score:s.growthScore, weight:s.weights.growth},
    {label:'Effort Delivered', score:s.effortScore, weight:s.weights.effort},
  ].map(c=>({...c, contribution: c.score*c.weight}));
  const byContribution = [...categories].sort((a,b)=>b.contribution-a.contribution);
  const weakest = [...categories].sort((a,b)=>a.score-b.score)[0];
  const top2 = byContribution.slice(0,2);
  const byPotentialGain = categories.map(c=>({...c, potentialGain: Math.round((100-c.score)*c.weight)})).filter(c=>c.potentialGain>0).sort((a,b)=>b.potentialGain-a.potentialGain);
  const gainTop2 = byPotentialGain.slice(0,2);
  const totalGain = gainTop2.reduce((s,c)=>s+c.potentialGain,0);
  const sentence = top2[0] && top2[1]
    ? `Your Heroes Score this period was driven mainly by <b>${escapeHtml(top2[0].label)}</b> (${top2[0].score}/100) and <b>${escapeHtml(top2[1].label)}</b> (${top2[1].score}/100).${weakest.score<70? ` <b>${escapeHtml(weakest.label)}</b> is currently your biggest opportunity to raise it further.` : ''}`
    : 'Not enough data yet this period to summarize what\'s driving your score.';
  const gainSentence = gainTop2.length? `Quickest path to 100: improving just <b>${gainTop2.map(c=>escapeHtml(c.label)).join('</b> and <b>')}</b> could add up to <b>+${totalGain}</b> points.` : '';
  const donutSegs = categories.map((c,i)=>({label:c.label, value:Math.max(0.5, Math.round(c.contribution*10)/10), color:AVATAR_COLORS[i%AVATAR_COLORS.length]}));
  return `<div class="card accent-teal">
    <h3>Your Heroes Score at a glance</h3>
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:6px">
      ${svgDonut(donutSegs,{size:118,thickness:16,centerValue:s.total,centerLabel:'/ 100'})}
      ${donutLegend(donutSegs)}
    </div>
    <p class="hint" style="margin-top:12px">${sentence}</p>
    ${gainSentence? `<p class="hint" style="margin-top:6px">${gainSentence}</p>` : ''}
  </div>`;
}

  if(r.type==='worked_day_off') return `Worked ${fmtDate(r.startDate)} → comp day ${fmtDate(r.compDate)}`;
  if(r.endDate && r.endDate!==r.startDate){
    const days = requestDayCount(r);
    return `${fmtDate(r.startDate)} → ${fmtDate(r.endDate)} (${days}d)${days>60?' <span style="color:var(--rose);font-weight:700">⚠ looks wrong — delete?</span>':''}`;

  return fmtDate(r.startDate);
}

/* ============ WEEKLY PREP ============ */
function renderWeeklyPrep(){
  const openTasks = state.tasks.filter(t=>t.status==='open');
  const today = todayStr();
  const pulse = openTasks.map(t=>{
    const daysLeft = businessDayDiff(t.deadline, today);
    let status, cls;
    if(daysLeft<0){ status='Overdue by '+Math.abs(daysLeft)+'d'; cls='neg'; }
    else if(daysLeft<=2){ status='Due soon ('+daysLeft+'d left)'; cls='zero'; }
    else { status='On track ('+daysLeft+'d left)'; cls='pos'; }
    return {t, status, cls, daysLeft};
  }).sort((a,b)=>a.daysLeft-b.daysLeft);

  const triggers = computeTriggers();
  const flags = triggers.filter(t=>t.severity==='IMMEDIATE'||t.severity==='URGENT');
  const decisions = triggers.filter(t=>t.severity==='STANDARD'||t.severity==='SCHEDULED');

  const weekStart = getWeekStart(today);
  const weekCommitments = state.commitments.filter(c=>c.weekStart===weekStart);

  return `
    <div class="page-head">
      <div><h1>Weekly Meeting Prep</h1><p>Auto-built agenda for the standing 45-minute weekly team meeting — delivery pulse, flags, decisions, and commitments.</p></div>
    </div>

    <div class="card accent-indigo">
      <h3>Delivery pulse</h3>
      <p class="hint">One line per active project — pulled straight from the Tasks page.</p>
      ${pulse.length? `
        <table>
          <thead><tr><th>Task</th><th>Assignee</th><th>Status</th></tr></thead>
          <tbody>
            ${pulse.map(p=>`<tr>
              <td>${escapeHtml(p.t.title)}</td>
              <td>${escapeHtml(employeeById(p.t.assigneeId)?.name||'—')}</td>
              <td><span class="badge ${p.cls}">${p.status}</span></td>
            </tr>`).join('')}
          </tbody>
        </table>
      ` : emptyState('▤','No active projects','Nothing open right now.')}
    </div>

    <div class="card accent-rose">
      <h3>Flags &amp; risks</h3>
      <p class="hint">Anything that needs visibility or a decision this week.</p>
      ${flags.length? flags.map(f=>`<div style="padding:8px 0;border-bottom:1px solid rgba(37,48,83,.5);font-size:13.5px">
        <span class="badge ${f.severity==='IMMEDIATE'?'neg':'zero'}" style="margin-right:8px">${f.severity}</span>${escapeHtml(f.text)}
      </div>`).join('') : `<div class="empty-state" style="padding:14px 0"><div class="t">No flags this week</div></div>`}
    </div>

    <div class="card accent-amber">
      <h3>Decisions needed</h3>
      ${decisions.length? decisions.map(d=>`<div style="padding:8px 0;border-bottom:1px solid rgba(37,48,83,.5);font-size:13.5px">
        <span class="badge zero" style="margin-right:8px">${d.severity}</span>${escapeHtml(d.text)}
      </div>`).join('') : `<div class="empty-state" style="padding:14px 0"><div class="t">Nothing pending a decision</div></div>`}
    </div>

    <div class="card accent-teal">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:${ui.showAddCommitment?'16px':'0'}">
        <div><h3 style="margin:0">This week's commitments</h3><p class="hint" style="margin:2px 0 0">Week of ${fmtDate(weekStart)} — one specific thing per person before next meeting.</p></div>
        <button class="btn btn-ghost btn-sm" id="btn-add-commitment">${ui.showAddCommitment?'Close form':'+ Add commitment'}</button>
      </div>
      ${ui.showAddCommitment? addCommitmentForm() : ''}
      ${weekCommitments.length? `
        <table style="margin-top:16px">
          <thead><tr><th></th><th>Member</th><th>Commitment</th></tr></thead>
          <tbody>
            ${weekCommitments.map(c=>`<tr>
              <td><input type="checkbox" data-toggle-commitment="${c.id}" ${c.done?'checked':''}></td>
              <td>${escapeHtml(employeeById(c.employeeId)?.name||'—')}</td>
              <td style="${c.done?'text-decoration:line-through;color:var(--text-faint)':''}">${escapeHtml(c.text)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      ` : `<div class="empty-state" style="padding-top:16px">No commitments logged for this week yet.</div>`}
    </div>
  `;
}

/* ============ QUALITY & COMPLIANCE ============ */
function renderQuality(){
  const mf = getMonthFilter('quality');
  const reviews = state.qualityReviews.filter(r=>inMonthFilter(r.date, mf)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const audits = state.complianceAudits.filter(a=>inMonthFilter(`${a.year}-${String(a.month).padStart(2,'0')}-01`, mf)).sort((a,b)=> new Date(b.year,b.month)-new Date(a.year,a.month));
  const teamQuality = reviews.length? Math.round(reviews.reduce((s,r)=>s+r.pct,0)/reviews.length) : null;
  const latestAudit = audits[0];
  const deliveries = state.deliveries.filter(d=>inMonthFilter(d.date, mf)).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const deliveryComplianceAvg = deliveries.length? Math.round(deliveries.reduce((s,d)=>s+d.checkRate,0)/deliveries.length) : null;
  const monitoringInScope = state.monitoringLogs.filter(m=>inMonthFilter(m.date, mf) && (m.status==='approved' || m.status===undefined));
  const monitoringHoursThisMonth = monitoringInScope.reduce((s,m)=>s+(Number(m.hours)||0),0);
  const satisfactionThisMonth = state.clientSatisfaction.filter(c=>inMonthFilter(c.date, mf));
  const satisfactionAvg = satisfactionThisMonth.length? (satisfactionThisMonth.reduce((s,c)=>s+c.score,0)/satisfactionThisMonth.length) : null;

  return `

      <div class="kpi teal"><div class="lbl">Team avg quality score</div><div class="val">${teamQuality===null?'—':teamQuality+'<small>%</small>'}</div></div>
      <div class="kpi"><div class="lbl">Compliance audits logged</div><div class="val">${audits.length}</div></div>
      <div class="kpi ${latestAudit && latestAudit.overallPct>=90 ? 'teal':''}"><div class="lbl">Latest compliance score</div><div class="val">${latestAudit?latestAudit.overallPct+'<small>%</small>':'—'}</div></div>
      <div class="kpi indigo"><div class="lbl">Deliveries logged</div><div class="val">${deliveries.length}</div></div>
      <div class="kpi ${deliveryComplianceAvg!==null && deliveryComplianceAvg>=90?'teal':''}"><div class="lbl">Delivery checkpoint rate</div><div class="val">${deliveryComplianceAvg===null?'—':deliveryComplianceAvg+'<small>%</small>'}</div></div>
      <div class="kpi teal"><div class="lbl">Training hours monitored</div><div class="val">${Math.round(monitoringHoursThisMonth*10)/10}<small>h</small></div></div>
      <div class="kpi ${satisfactionAvg!==null && satisfactionAvg>=4?'amber':''}"><div class="lbl">Avg client satisfaction</div><div class="val">${satisfactionAvg===null?'—':satisfactionAvg.toFixed(1)+'<small>/5</small>'}</div></div>
    </div>

    <div class="card accent-teal">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:${(ui.showAddReview||ui.editingReview)?'16px':'0'}">
        <div><h3 style="margin:0">Domain 1 — Deliverable quality reviews</h3><p class="hint" style="margin:2px 0 0">One entry per deliverable reviewed. Score each criterion 1 (Below) to 4 (Exceeds) — the weighted % is calculated automatically.</p></div>
        <button class="btn btn-ghost btn-sm" id="btn-add-review">${ui.showAddReview?'Close form':'+ Log a review'}</button>
      </div>
      ${(ui.showAddReview||ui.editingReview)? addReviewForm() : ''}
      ${reviews.length? `
        <table style="margin-top:16px">
          <thead><tr><th>Date</th><th>Designer</th><th>Program / Topic</th><th>Type</th><th>Score</th><th>Logged by</th><th></th></tr></thead>

/* ============ REPORTS ============ */
function currentQuarterInfo(){
  const now = new Date(todayStr()+'T00:00:00');
  const y = now.getFullYear();
  const qIdx = Math.floor(now.getMonth()/3); // 0-3
  const startMonth = qIdx*3;
  const start = new Date(y, startMonth, 1);
  const end = new Date(y, startMonth+3, 0);
  const pad = n=>String(n).padStart(2,'0');
  const toISO = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  return {startDate: toISO(start), endDate: toISO(end), label: `Q${qIdx+1} ${y}`};
}
function inQuarter(dateStr, q){
  if(!dateStr) return false;
  return dateStr >= q.startDate && dateStr <= q.endDate;
}
function computeQuarterAchievement(){
  const q = currentQuarterInfo();
  const materialTypes = new Set(['tt2','tt16','tt17']); // Training PPT, Handout, Trainer PPT Note — Training Outline lives only under Outlines/Proposals now
  const materialsTasks = state.tasks.filter(t=>materialTypes.has(t.typeId) && t.status==='done' && inQuarter(t.completedDate,q));
  const innovationTasks = state.tasks.filter(t=>t.typeId==='tt9' && t.status==='done' && inQuarter(t.completedDate,q));
  const outlineTasks = state.tasks.filter(t=>(t.typeId==='tt1' || (t.typeId==='tt14' && t.mode==='outline')) && t.status==='done' && inQuarter(t.completedDate,q));
  const monitoringInQ = state.monitoringLogs.filter(m=>(m.status==='approved'||m.status===undefined) && inQuarter(m.date,q));
  const monitoringHours = monitoringInQ.reduce((s,m)=>s+(Number(m.hours)||0),0);
  const deliveriesInQ = state.deliveries.filter(d=>inQuarter(d.date,q));
  const serverQualityAvg = deliveriesInQ.length? Math.round(deliveriesInQ.reduce((s,d)=>s+d.checkRate,0)/deliveriesInQ.length) : null;
  const reviewsInQ = state.qualityReviews.filter(r=>inQuarter(r.date,q));
  const implementationQualityAvg = reviewsInQ.length? Math.round(reviewsInQ.reduce((s,r)=>s+r.pct,0)/reviewsInQ.length) : null;

  return {
    quarterLabel: q.label,
    items: [
      {key:'materials', label:'Developed Materials', count: materialsTasks.length, suffix:'', tasks: materialsTasks, color:'#080828', textColor:'#ffffff'},
      {key:'innovations', label:'Learning Innovations', count: innovationTasks.length, suffix:'', tasks: innovationTasks, color:'#EBF4FF', textColor:'#1a1a2e'},
      {key:'outlines', label:'Outlines / Proposals', count: outlineTasks.length, suffix:'', tasks: outlineTasks, color:'#4D88E8', textColor:'#ffffff'},
      {key:'monitoring', label:'Training Monitoring', count: Math.round(monitoringHours*10)/10, suffix:'h', tasks: monitoringInQ, color:'#FFBC3A', textColor:'#1a1a2e'},
      {key:'qualityServer', label:'Quality Of Server', count: serverQualityAvg===null?'—':serverQualityAvg, suffix: serverQualityAvg===null?'':'%', deliveries: deliveriesInQ, color:'#F26A44', textColor:'#1a1a2e'},

function computeWeeklySummary(){
  const weekStart = getWeekStart(todayStr());
  const weekEnd = addDays(weekStart, 6);
  const today = todayStr();
  const inWeek = (d)=> !!d && d>=weekStart && d<=weekEnd;

  const received = state.tasks.filter(t=>inWeek(t.assignedDate));
  const delivered = state.tasks.filter(t=>t.status==='done' && inWeek(t.completedDate));
  const missed = state.tasks.filter(t=>t.status==='open' && inWeek(t.deadline) && t.deadline<today);

  const reviewFor = t=> t.reviewId ? state.qualityReviews.find(r=>r.id===t.reviewId) : null;
  const deliveredReviews = delivered.map(reviewFor).filter(Boolean);
  const qualityAvg = deliveredReviews.length? Math.round(deliveredReviews.reduce((s,r)=>s+r.pct,0)/deliveredReviews.length) : null;

  const typeBreakdown = {};
  delivered.forEach(t=>{
    const name = typeById(t.typeId)?.name || 'Other';
    typeBreakdown[name] = (typeBreakdown[name]||0)+1;
  });

  const totalHours = delivered.reduce((s,t)=>s+taskEstimatedHours(t),0);
  const inProgressHours = state.tasks.filter(t=>t.status==='open').reduce((s,t)=>s+taskEstimatedHours(t),0);
  const hoursByEmployee = {};
  delivered.forEach(t=>{ hoursByEmployee[t.assigneeId] = (hoursByEmployee[t.assigneeId]||0) + taskEstimatedHours(t); });

  // Team capacity this week = every employee's normal working hours, minus whatever leave/absence hours were approved for them this week
  const businessDaysThisWeek = businessDaysInclusive(weekStart, weekEnd);
  const teamCapacity = state.employees.length * businessDaysThisWeek * HOURS_PER_DAY;
  const teamLeaveHours = state.employees.reduce((s,e)=>s+employeeLeaveHoursInWeek(e.id, weekStart, weekEnd), 0);
  const availableCapacity = Math.max(0, teamCapacity - teamLeaveHours);

  // "Top performer" — reuse the exact same pick as Employee of the Month: the confirmed announcement for
  // this month if there is one, otherwise whoever the Heroes Score currently suggests.
  const mKey = monthKey(today);
  const confirmedEom = state.employeeOfMonth.find(x=>x.monthKey===mKey);
  let topPerformerId = null, topQuality = null, topHeroesScore = null;
  if(confirmedEom){
    topPerformerId = confirmedEom.employeeId;
    const s = computeHeroesScore(topPerformerId);
    topQuality = s.qualityScore; topHeroesScore = s.total;
  } else {
    const topCandidate = computeEomCandidates(mKey)[0];
    if(topCandidate){ topPerformerId = topCandidate.emp.id; topQuality = topCandidate.qualityAvg; topHeroesScore = topCandidate.combined; }
  }

  const monitoringHours = state.monitoringLogs.filter(m=>inWeek(m.date) && (m.status==='approved' || m.status===undefined)).reduce((s,m)=>s+(Number(m.hours)||0),0);

  const leaveDays = state.requests
    .filter(r=>r.type==='annual_leave' && r.status==='approved')
    .reduce((s,r)=>{
      const rStart=r.startDate, rEnd=r.endDate||r.startDate;
      const from = rStart>weekStart? rStart:weekStart;
      const to = rEnd<weekEnd? rEnd:weekEnd;
      return from<=to ? s+businessDaysInclusive(from,to) : s;
    }, 0);

  return {weekStart, weekEnd, received, delivered, missed, qualityAvg, typeBreakdown, totalHours, inProgressHours, hoursByEmployee, teamCapacity, teamLeaveHours, availableCapacity, topPerformerId, topQuality, topHeroesScore, monitoringHours, leaveDays};
}

// ===== Pipeline file import: fuzzy topic matching (JS port of the matching logic used for prior imports) =====
let _xlsxLoadPromise = null;
function ensureXLSXLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(_xlsxLoadPromise) return _xlsxLoadPromise;
  _xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _xlsxLoadPromise = null; reject(new Error('Could not load the Excel reader library — check your connection and try again')); };
    document.head.appendChild(s);
  });
  return _xlsxLoadPromise;
}
function normTopicStr(s){
  if(!s) return '';
  return String(s).replace(/\u00a0/g,' ').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
}
function matchTrainingTopic(eventTitle){
  const titleNorm = normTopicStr(eventTitle);
  const titleWords = titleNorm.split(' ').filter(w=>w.length>2);
  let best = null, bestScore = 0;
  state.trainingTopics.forEach(t=>{
    const namesToCheck = [t.topic, ...(t.aliases||[])];
    for(const name of namesToCheck){
      const topicNorm = normTopicStr(name);
      if(!topicNorm) continue;
      if(titleNorm.includes(topicNorm) || topicNorm.includes(titleNorm)){ best = t; bestScore = 999; return; }
    }
    const topicNorm = normTopicStr(t.topic);
    if(!topicNorm) return;
    const topicWords = topicNorm.split(' ').filter(w=>w.length>2);
    const overlap = topicWords.filter(w=>titleWords.includes(w)).length;
    const score = topicWords.length? overlap/topicWords.length : 0;
    if(score>bestScore && score>=0.6){ best = t; bestScore = score; }
  });
  return best;
}

// ===== Skillsbank DNA: Project DNA (training) + Trainer DNA registries =====
// Reuses the same normalize/fuzzy-match approach as the Pipeline topic matcher above, applied to trainer names.
// Datalist <option>s for every known trainer name (+ aliases) — paired with an <input list="..."> on
// any free-text "Trainer name" field so typing (e.g. "ah") shows matching existing trainers as native
// browser suggestions, while still allowing a name that isn't in the list at all (a new/freelance
// trainer not yet in the system). Never forces a choice — that's the point of <datalist> over <select>.
function trainerNamesDatalistOptions(){
  const names = new Set();
  state.trainers.forEach(t=>{
    if(t.name) names.add(t.name);
    (t.aliases||[]).forEach(a=>a && names.add(a));
  });
  return [...names].sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${escapeHtml(n)}">`).join('');
}
function matchTrainerEntity(name){
  if(!name) return null;
  const n = normTopicStr(name);
  if(!n) return null;
  let best = null;
  state.trainers.forEach(tr=>{
    const namesToCheck = [tr.name, ...(tr.aliases||[])];
    for(const cand of namesToCheck){
      const cn = normTopicStr(cand);
      if(!cn) continue;
      if(cn===n || n.includes(cn) || cn.includes(n)){ best = tr; return; }
    }
  });
  return best;
}
// Trainer names that show up in Pipeline requests (typed by the LXD team, or imported from the ops
// booking sheet) but don't match any existing Trainer DNA profile — surfaced so the team can decide
// to create a real profile for them (or dismiss a one-off/misspelled name) instead of the name just
// silently sitting there as plain unlinked text forever.
function getUnmatchedTrainerNames(){
  const seen = new Map(); // normalized name -> {name, count}
  state.pipeline.forEach(p=>{
    const name = (p.trainer||'').trim();
    if(!name) return;
    if(matchTrainerEntity(name)) return; // already has a profile
    const key = normTopicStr(name);
    if(!key || (ui.dismissedTrainerNames && ui.dismissedTrainerNames.has(key))) return;
    if(!seen.has(key)) seen.set(key, {name, count:0});
    seen.get(key).count++;
  });
  return [...seen.values()].sort((a,b)=>b.count-a.count);
}
function topicNamesFor(topic){ return [topic.topic, ...(topic.aliases||[])].map(normTopicStr).filter(Boolean); }
function recordMatchesTopic(rec, names, textFields){
  const val = normTopicStr(textFields.map(f=>rec[f]).find(v=>v) || '');
  if(!val) return false;
  return names.some(n=> n===val || val.includes(n) || n.includes(val));
}
// Aggregates everything the app already knows about one training program (Pipeline requests, Delivery Log
// entries, monitoring visits, client satisfaction) so Project DNA never duplicates data entry.
function projectDnaStats(topic){
  const names = topicNamesFor(topic);
  const pipelineRows = state.pipeline.filter(p=> p.matchedTopic===topic.topic || recordMatchesTopic(p, names, ['title']));
  const deliveryRows = state.deliveries.filter(d=> recordMatchesTopic(d, names, ['program']));
  const monitoringRows = state.monitoringLogs.filter(m=> recordMatchesTopic(m, names, ['program']));
  const satisfactionRows = state.clientSatisfaction.filter(c=> recordMatchesTopic(c, names, ['program']));
  const clients = new Set(); pipelineRows.forEach(p=>p.client&&clients.add(p.client)); deliveryRows.forEach(d=>d.client&&clients.add(d.client));
  const trainerNames = new Set(); pipelineRows.forEach(p=>p.trainer&&trainerNames.add(p.trainer)); deliveryRows.forEach(d=>d.trainer&&trainerNames.add(d.trainer));
  const modes = new Set(); pipelineRows.forEach(p=>p.mode&&modes.add(p.mode)); deliveryRows.forEach(d=>d.mode&&modes.add(d.mode));
  const satAvg = satisfactionRows.length? (satisfactionRows.reduce((s,c)=>s+c.score,0)/satisfactionRows.length) : null;
  const deliveredCount = pipelineRows.filter(p=>p.status==='done').length + deliveryRows.length;
  const allDates = [...pipelineRows.map(p=>p.eventDate), ...deliveryRows.map(d=>d.date)].filter(Boolean).sort();
  return {
    pipelineRows, deliveryRows, monitoringRows, satisfactionRows,
    clients: [...clients], trainers: [...trainerNames].map(n=>({name:n, entity:matchTrainerEntity(n)})),
    modes: [...modes], satAvg, satCount: satisfactionRows.length,
    deliveredCount, lastDeliveredDate: allDates.length? allDates[allDates.length-1] : null,
  };
}
// Aggregates everything the app knows about one trainer, matched by name (and any aliases on their profile)
// against the free-text "trainer" field already captured in Pipeline rows and Delivery Log entries.
function trainerDnaStats(trainer){
  const names = [trainer.name, ...(trainer.aliases||[])].map(normTopicStr).filter(Boolean);
  const matches = rec => { const rn = normTopicStr(rec.trainer||''); return rn && names.some(n=> rn===n || rn.includes(n) || n.includes(rn)); };
  const pipelineRows = state.pipeline.filter(matches);
  const deliveryRows = state.deliveries.filter(matches);
  const programs = new Set(); pipelineRows.forEach(p=>{ if(p.matchedTopic||p.title) programs.add(p.matchedTopic||p.title); }); deliveryRows.forEach(d=>{ if(d.program) programs.add(d.program); });
  const clients = new Set(); pipelineRows.forEach(p=>p.client&&clients.add(p.client)); deliveryRows.forEach(d=>d.client&&clients.add(d.client));
  const deliveredCount = pipelineRows.filter(p=>p.status==='done').length + deliveryRows.length;
  const allDates = [...pipelineRows.map(p=>p.eventDate), ...deliveryRows.map(d=>d.date)].filter(Boolean).sort();
  // Client Satisfaction entries have no trainer field of their own — they're logged against a client + program
  // (Client Satisfaction card, Heroes Score). Attribute a score to this trainer when its client+program pair
  // matches one this trainer actually delivered (via Pipeline/Delivery Log), so it shows up here and on Project DNA.
  const programClientPairs = new Set();
  pipelineRows.forEach(p=>{ const prog=normTopicStr(p.matchedTopic||p.title||''); if(prog) programClientPairs.add(prog+'|'+normTopicStr(p.client||'')); });
  deliveryRows.forEach(d=>{ const prog=normTopicStr(d.program||''); if(prog) programClientPairs.add(prog+'|'+normTopicStr(d.client||'')); });
  const satisfactionRows = state.clientSatisfaction.filter(c=>{
    const prog = normTopicStr(c.program||'');
    if(!prog) return false;
    const key = prog+'|'+normTopicStr(c.client||'');
    return programClientPairs.has(key) || [...programClientPairs].some(k=>k.startsWith(prog+'|'));
  });
  const satAvg = satisfactionRows.length? (satisfactionRows.reduce((s,c)=>s+c.score,0)/satisfactionRows.length) : null;
  return {
    pipelineRows, deliveryRows, programs: [...programs], clients: [...clients],
    deliveredCount, lastDeliveredDate: allDates.length? allDates[allDates.length-1] : null,
    satisfactionRows, satAvg, satCount: satisfactionRows.length,
  };
}
function ensureTopicDna(t){
  if(!t.description) t.description = '';
  if(!t.tools) t.tools = {boardGame:false, vr:false, aiTools:false};
  if(t.tools.boardGameName===undefined) t.tools.boardGameName = '';
  if(t.tools.vrName===undefined) t.tools.vrName = '';
  if(t.durationDays===undefined) t.durationDays = null;
  if(!t.language) t.language = null; // 'Arabic' | 'English' | 'Both'
  if(!t.deliveryFormat) t.deliveryFormat = null; // 'Classroom' | 'Virtual' | 'Both'
  if(!t.bdFeedback) t.bdFeedback = [];
  if(t.dnaUpdatedAt===undefined) t.dnaUpdatedAt = null;
  if(t.dnaSource===undefined) t.dnaSource = null; // 'lxd-officer' once auto-synced from real indexed content
  return t;
}
function ensureTrainerDna(tr){
  if(!tr.aliases) tr.aliases = [];
  if(tr.dayRate===undefined) tr.dayRate = null;
  if(!tr.bio) tr.bio = '';
  if(!tr.cvUrl) tr.cvUrl = '';
  if(!tr.email) tr.email = '';
  if(!tr.phone) tr.phone = '';
  if(!tr.availabilityNote) tr.availabilityNote = '';
  if(!tr.bdFeedback) tr.bdFeedback = [];
  if(!tr.historicalDeliveries) tr.historicalDeliveries = []; // [{topic, count}] — undated bulk-imported history (e.g. from a Trainer Analysis pivot sheet), separate from dated Pipeline/Delivery Log records
  if(tr.dnaUpdatedAt===undefined) tr.dnaUpdatedAt = null;
  return tr;
}
// Sums a trainer's imported historical-delivery counts for one topic name (fuzzy-matched), for folding into Project DNA totals.
function historicalCountForTopic(topic){
  const names = topicNamesFor(topic);
  let total = 0; const trainerNames = [];
  state.trainers.forEach(tr=>{
    (tr.historicalDeliveries||[]).forEach(h=>{
      const hn = normTopicStr(h.topic);
      if(names.some(n=> n===hn || hn.includes(n) || n.includes(hn))){ total += (h.count||0); trainerNames.push(tr.name); }
    });
  });
  return {total, trainerNames};
}
// Cross-references a trainer's delivered programs (live Pipeline/Delivery Log stats + imported historical deliveries)
// against each matched topic's Project DNA board-game/VR flags, so Trainer DNA can answer "has this trainer done a board game/VR training before?"
function trainerToolExperience(tr, stats){
  const names = new Set();
  (stats.programs||[]).forEach(p=>p&&names.add(p));
  (tr.historicalDeliveries||[]).forEach(h=>h.topic&&names.add(h.topic));
  const boardGames = [], vrs = [];
  const seenBG = new Set(), seenVR = new Set();
  names.forEach(name=>{
    const t = state.trainingTopics.find(x=>x.topic===name) || matchTrainingTopic(name);
    if(!t) return;
    ensureTopicDna(t);
    if(t.tools.boardGame && !seenBG.has(t.id)){ seenBG.add(t.id); boardGames.push({topicId:t.id, topic:t.topic, name:t.tools.boardGameName||''}); }
    if(t.tools.vr && !seenVR.has(t.id)){ seenVR.add(t.id); vrs.push({topicId:t.id, topic:t.topic, name:t.tools.vrName||''}); }
  });
  return {boardGames, vrs};
}

// ===== Skillsbank DNA file import — BD's Excel/CSV sheet, layered on top of what's auto-aggregated =====
// Expected columns (case/spacing tolerant): Type (Project/Trainer), Name, Aliases, Description, Duration Days,
// Language, Format, Board Game, VR, AI Tools, CV Link, Day Rate, Availability, Email, Phone, Bio, Feedback, Feedback Author, Feedback Date.
// Reuses parsePipelineFile() — it's a generic CSV/XLSX-to-row-objects reader, not Pipeline-specific.
function dnaCell(row, headerMap, ...names){
  for(const n of names){
    const key = headerMap.get(normTopicStr(n));
    if(key!==undefined && row[key]!==undefined && String(row[key]).trim()!=='') return String(row[key]).trim();
  }
  return '';
}
function dnaBool(v){ const n = normTopicStr(v); return n==='yes'||n==='y'||n==='true'||n==='1'; }
function buildDnaImportPreview(rows){
  if(!rows.length) return {projectUpdates:[], trainerUpdates:[], needsReview:[]};
  const headerMap = new Map(Object.keys(rows[0]).map(h=>[normTopicStr(h), h]));
  const projectUpdates = [], trainerUpdates = [], needsReview = [];
  rows.forEach(row=>{
    const name = dnaCell(row, headerMap, 'Name', 'Topic Name', 'Trainer Name');
    if(!name) return;
    let type = dnaCell(row, headerMap, 'Type').toLowerCase();
    const matchedTopic = state.trainingTopics.find(t=>t.topic===name) || matchTrainingTopic(name);
    const matchedTrainer = matchTrainerEntity(name);
    if(!type) type = matchedTopic? 'project' : 'trainer'; // default: trainer roster, unless the name is a known training topic
    const feedbackText = dnaCell(row, headerMap, 'Feedback');
    const feedback = feedbackText? {
      text: feedbackText,
      author: dnaCell(row, headerMap, 'Feedback Author') || 'BD',
      date: parsePipelineDate(dnaCell(row, headerMap, 'Feedback Date')) || todayStr(),
    } : null;
    if(type.startsWith('project') || type.startsWith('topic')){
      if(!matchedTopic){ needsReview.push({name, reason:'No matching training topic found in Training Owner'}); return; }
      const fields = {};
      const desc = dnaCell(row, headerMap, 'Description'); if(desc) fields.description = desc;
      const dur = dnaCell(row, headerMap, 'Duration Days', 'Duration'); if(dur) fields.durationDays = Number(dur)||null;
      const lang = dnaCell(row, headerMap, 'Language'); if(lang) fields.language = lang;
      const format = dnaCell(row, headerMap, 'Format', 'Delivery Format'); if(format) fields.deliveryFormat = format;
      const bg = dnaCell(row, headerMap, 'Board Game'); if(bg) fields.boardGame = dnaBool(bg);
      const vr = dnaCell(row, headerMap, 'VR'); if(vr) fields.vr = dnaBool(vr);
      const ai = dnaCell(row, headerMap, 'AI Tools', 'AI'); if(ai) fields.aiTools = dnaBool(ai);
      projectUpdates.push({topicId: matchedTopic.id, topic: matchedTopic.topic, fields, feedback});
    } else {
      const aliases = dnaCell(row, headerMap, 'Aliases').split(',').map(s=>s.trim()).filter(Boolean);
      const fields = {};
      const cv = dnaCell(row, headerMap, 'CV Link', 'CV'); if(cv) fields.cvUrl = cv;
      const rate = dnaCell(row, headerMap, 'Day Rate'); if(rate) fields.dayRate = rate;
      const avail = dnaCell(row, headerMap, 'Availability'); if(avail) fields.availabilityNote = avail;
      const email = dnaCell(row, headerMap, 'Email', 'E-Mail', 'E Mail'); if(email) fields.email = email;
      const phone = dnaCell(row, headerMap, 'Phone', 'Phone Number', 'Contact', 'Contact Number', 'Mobile', 'Mobile Number', 'Tel'); if(phone) fields.phone = phone;
      const bio = dnaCell(row, headerMap, 'Bio'); if(bio) fields.bio = bio;
      trainerUpdates.push({trainerId: matchedTrainer? matchedTrainer.id : null, name, aliases, fields, feedback});
    }
  });
  return {projectUpdates, trainerUpdates, needsReview};
}
function parsePipelineDate(v){
  if(!v) return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return s.slice(0,10);
  return null;
}
function parsePipelineFile(file){
  const isCsv = /\.csv$/i.test(file.name);
  const doParse = ()=> new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Could not read the file'));
    if(isCsv){
      reader.onload = ()=>{
        try{
          const text = reader.result;
          const lines = text.split(/\r\n|\n|\r/).filter(l=>l.length);
          const parseLine = line=>{
            const cells=[]; let cur=''; let inQ=false;
            for(let i=0;i<line.length;i++){
              const c=line[i];
              if(inQ){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
              else{ if(c==='"') inQ=true; else if(c===','){cells.push(cur);cur='';} else cur+=c; }
            }
            cells.push(cur);
            return cells;
          };
          const headers = parseLine(lines[0]).map(h=>h.replace(/^\uFEFF/,'').trim());
          const rows = lines.slice(1).map(l=>{
            const cells = parseLine(l);
            const obj = {};
            headers.forEach((h,i)=>obj[h]=cells[i]!==undefined?cells[i].trim():'');
            return obj;
          });
          resolve(rows);
        }catch(e){ reject(e); }
      };
      reader.readAsText(file);
    } else {
      reader.onload = ()=>{
        try{
          const wb = XLSX.read(reader.result, {type:'array', cellDates:true});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
          resolve(rows);
        }catch(e){ reject(e); }
      };
      reader.readAsArrayBuffer(file);
    }
  });
  return isCsv? doParse() : ensureXLSXLoaded().then(doParse);
}
function buildPipelinePreview(rows){
  const existingIds = new Set(state.pipeline.map(i=>i.eventId));
  const uploadedIds = new Set();
  const items = [];
  let skippedNotConfirmed=0, skippedDuplicate=0;
  rows.forEach(r=>{
    const status = (r['Status']||'').toString().trim();
    const uc = (r['UC Code']||'').toString().trim();
    if(uc) uploadedIds.add(uc);
    if(status && status!=='Confirmed'){ skippedNotConfirmed++; return; }
    if(!uc) return;
    if(existingIds.has(uc)){ skippedDuplicate++; return; }
    const title = (r['Topics Name']||'').toString().replace(/\u00a0/g,' ').trim();
    if(!title) return;
    const match = matchTrainingTopic(title);
    const startDate = parsePipelineDate(r['Start Date']) || parsePipelineDate(r['End Date']) || parsePipelineDate(r['Dates']);
    items.push({
      id: 'pl_'+uc, eventId: uc, title,
      client: (r['Clients Name']||'').toString().trim() || null,
      region: (r['Department']||'').toString().trim() || null,
      mode: (r['Classroom / Virtual']||'').toString().trim() || null,
      eventDate: startDate,
      datesText: (r['Dates']||'').toString().trim() || null,
      trainer: (r['Trainer Name']||'').toString().trim() || null,
      location: (r['Location']||'').toString().trim() || null,
      month: (r['Month']||'').toString().trim() || null,
      opsSpoc: (r['Ops Spoc']||'').toString().trim() || null,
      sourceStatus: status || null,
      matchedTopic: match? match.topic : null,
      assignedTo: match? match.employeeId : null,
      status: match? 'assigned' : 'needs_review',
      seenByAssignee: false,
      createdAt: new Date().toISOString(),
    });
    existingIds.add(uc); // guard against duplicate UC codes within the same file
  });
  // Stale unresolved requests: still sitting as 'needs_review' but no longer present in this sheet at all —
  // the sheet is the source of truth, so these get cleared out. Never touches assigned/in_progress/done items.
  const stale = state.pipeline.filter(i=>i.status==='needs_review' && !uploadedIds.has(i.eventId));
  return { items, stale, skippedNotConfirmed, skippedDuplicate };
}
// Auto-archives any Pipeline request whose event date has already passed, regardless of its status
// (assigned, in_progress, or even still done) — once the date is gone, it no longer belongs in the
// active "All requests" list, so it moves to History automatically instead of needing a manual click.
// Runs once per app load (see init()); returns true if it changed anything (caller saves only then).
function autoArchiveExpiredPipeline(){
  const today = todayStr(); // 'YYYY-MM-DD', matches eventDate's own format — safe as a string compare
  let changed = false;
  state.pipeline.forEach(i=>{
    if(i.status==='archived' || !i.eventDate) return;
    if(i.eventDate < today){
      i.status = 'archived';
      i.archivedAt = new Date().toISOString();
      i.archivedReason = 'date_passed'; // distinguishes this from the "stale — dropped from sheet" path
      changed = true;
    }
  });
  return changed;
}

// Indexes a batch of already-uploaded fileIds with a small concurrency limit (rather than one
// Edge Function call at a time) so many-file uploads finish much faster, and rather than firing all
// of them at once (which would overload OpenAI rate limits and make every single one slower/likelier
// to time out). Runs in the background — callers don't need to await this to keep the UI responsive;
// polling (started by the caller) is what shows live progress as each file moves through the table.
async function runLxdIndexQueue(fileIds){
  // Kept low on purpose: each file's own ingest already runs its own vision calls concurrently
  // (VISION_CONCURRENCY in the Edge Function), and OpenAI's tokens-per-minute limit is shared across
  // every one of those calls at once, regardless of which file they belong to. The Edge Function
  // retries automatically on a 429, but keeping fewer files running at once means fewer retries.
  const CONCURRENCY = 2;
  let idx = 0;
  async function worker(){
    while(idx < fileIds.length){
      const fileId = fileIds[idx++];
      try{
        await sbClient.functions.invoke('lxd-officer-ingest', { body:{ fileId } });
      }catch(e){
        console.error('LXD Officer indexing failed for', fileId, e);
      }
      await loadLxdOfficerFiles();
      refreshLxdOfficerFilesCardOnly();
    }
  }
  const workers = Array.from({length: Math.min(CONCURRENCY, fileIds.length)}, ()=>worker());
  await Promise.all(workers);
  await loadLxdOfficerFiles();
  refreshLxdOfficerFilesCardOnly();
}
// Unzips a .pptx and pulls out its slide text + embedded images IN THE BROWSER, mirroring what
// lxd-officer-ingest's Edge Function used to do itself before this was moved here. Two real
// incidents made that move necessary: (1) Supabase Storage's per-file upload limit rejected large
// decks outright (a deck with embedded video easily passes 100MB, none of which this feature ever
// reads), and (2) loading + unzipping a large deck's raw bytes routinely exceeded the Edge
// Function's own memory limit and silently killed it mid-run (confirmed via Supabase's function
// logs: "Memory limit exceeded", ~600ms in — i.e. it died on the initial buffer/zip load, before
// ever reaching image processing) — the file's row was left stuck on "processing" forever with no
// error, since the crash happened outside any catchable exception. The browser has far more memory
// headroom for this than a constrained serverless isolate, and doing it here means the raw .pptx
// (with any embedded video/audio, never used for indexing anyway) never has to leave this machine at
// all — only the extracted text + a handful of filtered images get uploaded.
const LXD_MAX_IMAGES_PER_FILE = 150;
const LXD_MAX_IMAGE_BYTES = 6 * 1024 * 1024; // 6MB — skip unusually large images (rare for a slide diagram)
const LXD_MIN_IMAGE_BYTES = 3000; // skip tiny icons/bullets/dividers
// Caps the COMBINED size of every image in one deck, on top of the per-image cap above. A per-image
// cap alone still lets a deck with many images near that cap add up to a huge extracted JSON (83
// images at a few MB each is 200MB+) — and downloading + JSON.parse-ing that in the Edge Function
// hits the exact same "Memory limit exceeded" crash the whole browser-side extraction was meant to
// avoid, just one step later. Once this budget is hit, remaining images are simply left out (their
// slide's plain text is still indexed) — same trade-off as the server's own image-description time
// budget.
const LXD_MAX_TOTAL_IMAGE_BYTES = 20 * 1024 * 1024; // 20MB combined
const LXD_IMAGE_MIME = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp' };
async function lxdExtractPptxContent(file){
  if(typeof JSZip === 'undefined'){
    throw new Error('The .pptx reader (JSZip) failed to load — check your internet connection and try again.');
  }
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);

  // Slide text, in slide order.
  const slideFiles = Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n));
  slideFiles.sort((a,b)=>{
    const na = parseInt(a.match(/slide(\d+)\.xml/)[1],10);
    const nb = parseInt(b.match(/slide(\d+)\.xml/)[1],10);
    return na-nb;
  });
  const slides = [];
  for(const fname of slideFiles){
    const num = parseInt(fname.match(/slide(\d+)\.xml/)[1],10);
    const xml = await zip.files[fname].async('string');
    // FIXED (Sep 2026): the old pattern required a bare `<a:t>` with no attributes, but PowerPoint
    // very commonly writes `<a:t xml:space="preserve">…</a:t>` (any run with a leading/trailing
    // space — i.e. most ordinary sentences) or `<a:t lang="...">…</a:t>`. The bare-tag pattern
    // silently dropped every one of those runs, so real decks came out with far less text extracted
    // than they actually have (confirmed: a 125-slide deck only yielded 17 non-empty chunks). `[^>]*`
    // now matches any attributes on the opening tag.
    const matches = [...xml.matchAll(/<a:t[^>]*>([^<]*)<\/a:t>/g)].map(m=>m[1]);
    const text = matches.join(' ').replace(/\s+/g,' ').trim();
    slides.push({ slideNum: num, text });
  }

  // Embedded raster images (diagrams/matrices pasted as pictures) — found via each slide's .rels
  // file, same approach the Edge Function used to use. Video/audio/vector formats never match
  // LXD_IMAGE_MIME's extensions, so they're never touched — this is what keeps the extracted
  // payload small even for a deck whose raw file is huge because of embedded video.
  const relFiles = Object.keys(zip.files).filter(n=>/^ppt\/slides\/_rels\/slide\d+\.xml\.rels$/.test(n));
  const images = [];
  let totalImageBytes = 0;
  let imagesSkippedForBudget = 0;
  for(const relFile of relFiles){
    const slideNum = parseInt(relFile.match(/slide(\d+)\.xml\.rels/)[1],10);
    const xml = await zip.files[relFile].async('string');
    const rels = [...xml.matchAll(/<Relationship[^>]*Type="[^"]*\/image"[^>]*Target="([^"]+)"[^>]*\/?>/g)].map(m=>m[1]);
    for(const target of rels){
      if(images.length >= LXD_MAX_IMAGES_PER_FILE) continue;
      if(totalImageBytes >= LXD_MAX_TOTAL_IMAGE_BYTES) { imagesSkippedForBudget++; continue; }
      const mediaPath = 'ppt/' + target.replace(/^\.\.\//,'').replace(/^\//,'');
      const ext = (mediaPath.split('.').pop()||'').toLowerCase();
      const mime = LXD_IMAGE_MIME[ext];
      if(!mime || !zip.files[mediaPath]) continue;
      const b64 = await zip.files[mediaPath].async('base64');
      const byteLen = Math.floor(b64.length * 3 / 4);
      if(byteLen < LXD_MIN_IMAGE_BYTES || byteLen > LXD_MAX_IMAGE_BYTES) continue;
      if(totalImageBytes + byteLen > LXD_MAX_TOTAL_IMAGE_BYTES) { imagesSkippedForBudget++; continue; }
      totalImageBytes += byteLen;
      images.push({ slideNum, dataUri: `data:${mime};base64,${b64}` });
    }
  }

  return { slides, images, imagesSkippedForBudget };
}

// Exact match first, fuzzy fallback (same pattern used by buildDnaImportPreview/historicalCountForTopic elsewhere) —
// catches topic names that differ slightly in casing/spacing/wording from the catalogue's own text.
function findCatalogueTopicMatch(name){
  return state.trainingTopics.find(t=>t.topic===name) || matchTrainingTopic(name);
}
// Turns a deck's file name into a usable training name for LXD Officer uploads, so nobody has to
// type/pick a name per file: strips the extension, swaps separators for spaces, drops a leading
// version/date-ish prefix in parentheses or brackets, and tidies whitespace.
function deriveTrainingNameFromFilename(filename){
  let name = String(filename||'').replace(/\.pptx$/i,'');
  name = name.replace(/[_\-]+/g,' ');
  name = name.replace(/\s*[\(\[][^\)\]]*[\)\]]\s*/g,' '); // drop "(v2)", "[final]", "(2026)"-style bits
  name = name.replace(/\s+/g,' ').trim();
  return name || filename;
}

/* ---- export helpers ---- */
function downloadFile(filename, content, mime){
  try{
    const blob = new Blob([content], {type: mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}
function csvCell(v){
  const s = String(v??'');
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCSV(rows){
  return rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
}
