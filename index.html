/* ---- chart helpers ---- */
function svgDonut(segments, opts){
  opts = opts||{};
  const size = opts.size||128, thickness = opts.thickness||16;
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = (size-thickness)/2;
  const c = 2*Math.PI*r;
  const cx=size/2, cy=size/2;
  let offset=0, circles='';
  if(total<=0){
    circles = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${thickness}"></circle>`;
  } else {
    segments.filter(s=>s.value>0).forEach(seg=>{
      const frac = seg.value/total;
      const len = frac*c;
      circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${thickness}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
      offset += len;
    });
  }
  const centerVal = opts.centerValue!=null? opts.centerValue : total;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:0 0 auto">
    ${circles}
    <text x="${cx}" y="${cy-1}" text-anchor="middle" font-family="Cairo, sans-serif" font-weight="800" font-size="${Math.round(size*0.19)}" fill="var(--text)">${centerVal}</text>
    ${opts.centerLabel? `<text x="${cx}" y="${cy+size*0.14}" text-anchor="middle" font-family="Inter, sans-serif" font-size="${Math.round(size*0.08)}" fill="var(--text-dim)">${escapeHtml(opts.centerLabel)}</text>` : ''}
  </svg>`;
}
function donutLegend(segments){
  const total = segments.reduce((s,x)=>s+x.value,0);
  return `<div style="display:flex;flex-direction:column;gap:7px;min-width:150px">
    ${segments.map(s=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px">
      <span style="width:10px;height:10px;border-radius:3px;background:${s.color};flex:0 0 auto"></span>
      <span style="color:var(--text-dim);flex:1">${escapeHtml(s.label)}</span>
      <span style="font-weight:700">${s.value}${total?` <span style="color:var(--text-faint);font-weight:500">(${Math.round(s.value/total*100)}%)</span>`:''}</span>
    </div>`).join('')}
  </div>`;
}
function svgLineChart(points, opts){
  opts = opts||{};
  const width=opts.width||520, height=opts.height||160, pad=30;
  const color = opts.color||'var(--indigo)';
  if(!points.length) return `<div class="empty-state" style="padding:20px 0"><div class="d">${escapeHtml(opts.emptyText||'Not enough data yet')}</div></div>`;
  const values = points.map(p=>p.value);
  let min = opts.yMin!=null? opts.yMin : Math.min(...values);
  let max = opts.yMax!=null? opts.yMax : Math.max(...values);
  if(min===max){ min-=5; max+=5; }
  const innerW = width-pad*2, innerH = height-pad*2;
  const stepX = points.length>1? innerW/(points.length-1) : 0;
  const xy = points.map((p,i)=>({
    x: pad + i*stepX,
    y: pad + innerH - ((p.value-min)/(max-min))*innerH,
    ...p
  }));
  const path = xy.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${xy[xy.length-1].x.toFixed(1)},${(pad+innerH).toFixed(1)} L${xy[0].x.toFixed(1)},${(pad+innerH).toFixed(1)} Z`;
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" style="overflow:visible">
    <line x1="${pad}" y1="${(pad+innerH).toFixed(1)}" x2="${width-pad}" y2="${(pad+innerH).toFixed(1)}" stroke="var(--border)" stroke-width="1"></line>
    <path d="${areaPath}" fill="${color}" opacity="0.12"></path>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"></path>
    ${xy.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}"></circle>
      <text x="${p.x.toFixed(1)}" y="${(p.y-10).toFixed(1)}" text-anchor="middle" font-size="11" font-family="Inter, sans-serif" fill="var(--text-dim)">${p.value}${opts.suffix||''}</text>
      <text x="${p.x.toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="10.5" font-family="Inter, sans-serif" fill="var(--text-faint)">${escapeHtml(String(p.label))}</text>`).join('')}
  </svg>`;
}
function svgBarChart(bars, opts){
  opts = opts||{};
  const width=opts.width||560, height=opts.height||190, pad=30;
  if(!bars.length) return `<div class="empty-state" style="padding:20px 0"><div class="d">${escapeHtml(opts.emptyText||'Not enough data yet')}</div></div>`;
  const maxV = Math.max(1, ...bars.map(b=>Math.abs(b.value)));
  const innerW = width-pad*2, innerH = height-pad*2;
  const gap = innerW/bars.length;
  const bw = gap*0.55;
  const baseY = pad+innerH;
  return `<svg width="100%" viewBox="0 0 ${width} ${height}" style="overflow:visible">
    <line x1="${pad}" y1="${baseY}" x2="${width-pad}" y2="${baseY}" stroke="var(--border)" stroke-width="1"></line>
    ${bars.map((b,i)=>{
      const x = pad + i*gap + (gap-bw)/2;
      const h = (Math.abs(b.value)/maxV)*innerH;
      const y = baseY-h;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${b.color||'var(--indigo)'}"></rect>
        <text x="${(x+bw/2).toFixed(1)}" y="${(y-6).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" font-family="Cairo, sans-serif" fill="var(--text)">${Number.isInteger(b.value)?b.value:(Math.round(b.value*10)/10)}</text>
        <text x="${(x+bw/2).toFixed(1)}" y="${height-8}" text-anchor="middle" font-size="10.5" font-family="Inter, sans-serif" fill="var(--text-faint)">${escapeHtml(String(b.label))}</text>`;
    }).join('')}
  </svg>`;
}
function monthKey(dateStr){ const d=new Date(dateStr+'T00:00:00'); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

/* ============ Global per-page month filter ============
   Every reporting page (Dashboard, Team, Quality & Compliance, Reports, Manager Brief) can be scoped to a
   single month, or 'all' for everything since the system started. Open/pending-approval tasks always show
   regardless of the filter — only completed work and historical logs are affected. */
function getMonthFilter(page){
  if(!ui.monthFilters[page]) ui.monthFilters[page] = monthKey(todayStr());
  return ui.monthFilters[page];
}
function setMonthFilter(page, val){ ui.monthFilters[page] = val; }
function inMonthFilter(dateStr, filterKey){
  if(filterKey==='all') return true;
  if(!dateStr) return false;
  return monthKey(dateStr)===filterKey;
}
function allMonthKeysWithData(){
  const dates = [];
  state.tasks.forEach(t=>{ if(t.completedDate) dates.push(t.completedDate); });
  state.qualityReviews.forEach(r=>{ if(r.date) dates.push(r.date); });
  state.complianceAudits.forEach(a=>{ if(a.year && a.month) dates.push(`${a.year}-${String(a.month).padStart(2,'0')}-01`); });
  state.checkins.forEach(c=>{ if(c.year && c.month) dates.push(`${c.year}-${String(c.month).padStart(2,'0')}-01`); });
  state.oneOnOnes.forEach(o=>{ if(o.date) dates.push(o.date); });
  state.commitments.forEach(c=>{ if(c.weekStart) dates.push(c.weekStart); });
  state.requests.forEach(r=>{ if(r.startDate) dates.push(r.startDate); });
  state.attendanceLogs.forEach(a=>{ if(a.month) dates.push(a.month+'-01'); });
  state.monitoringLogs.forEach(m=>{ if(m.date) dates.push(m.date); });
  state.clientSatisfaction.forEach(c=>{ if(c.date) dates.push(c.date); });
  dates.push(todayStr()); // always include the current month even before any data exists
  const keys = Array.from(new Set(dates.filter(Boolean).map(monthKey))).sort();
  return keys;
}
function monthFilterLabel(k){
  const [y,m] = k.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function renderMonthFilterControl(page){
  const months = allMonthKeysWithData();
  const selected = getMonthFilter(page);
  return `<select class="month-filter-select" data-month-filter-page="${page}" title="Scope this page to one month, or All time">
    ${months.slice().reverse().map(k=>`<option value="${k}" ${selected===k?'selected':''}>${escapeHtml(monthFilterLabel(k))}</option>`).join('')}
    <option value="all" ${selected==='all'?'selected':''}>All time</option>
  </select>`;
}
function readAndResizePhoto(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const size = 220;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size/img.width, size/img.height);
        const w = img.width*scale, h = img.height*scale;
        ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        const safeTopic = (topicName.replace(/[^a-zA-Z0-9؀-ۿ _-]/g,'').slice(0,60) || 'training').replace(/\s+/g,'_');
        const path = `${safeTopic}/${Date.now()}_extracted.json`;
        const payload = new Blob([JSON.stringify({ slides: extracted.slides, images: extracted.images })], { type:'application/json' });
        const { error: upErr } = await sbClient.storage.from('training-content').upload(path, payload, { upsert:false, contentType:'application/json' });
        if(upErr) throw upErr;
        const { data: row, error: insErr } = await sbClient.from('training_content_files').insert({
          topic_id: matchedTopic? matchedTopic.id : null,
          topic_name: topicName,
          file_path: path,
          original_filename: file.name,
          visual_notes: notes || null,
          status: 'pending',
          uploaded_by: actorLabel(),
        }).select('id').single();
        if(insErr) throw insErr;
        toIndex.push(row.id);
        okCount++;
      }catch(e){
        failCount++;
        const reason = (e && (e.message || e.error_description || e.statusText)) || String(e);
        ui.lxdOfficerUploadFailures.push({ name: file.name, reason });
        console.error('LXD Officer upload failed for', file.name, e);
      }
    }
    ui.lxdOfficerUploading = false;
    ui.lxdOfficerUploadMsg = `${okCount} file(s) uploaded${failCount? `, ${failCount} failed to upload` : ''}. Indexing running in the background — watch the table below for live progress.`;
    ui.lxdOfficerUploadNotes = '';
    await loadLxdOfficerFiles();
    render();
    startLxdOfficerPolling();
    // Phase 2: index the uploaded files with limited concurrency, in the background — not awaited,
    // so the button/upload UI is free the moment files are uploaded; the table (via polling) is what
    // shows each file moving through "processing" -> live progress -> "done".
    if(toIndex.length) runLxdIndexQueue(toIndex);
  };

    const toEmployeeId = document.getElementById('so-to').value;
    const message = document.getElementById('so-message').value.trim();
    if(!message){ showToast('Please write the reason for this high five'); return; }
    const fromId = session.role==='employee'? session.employeeId : session.role;
    const mKey = monthKey(todayStr());
    const alreadySent = state.shoutouts.some(s=>s.fromId===fromId && monthKey(s.date)===mKey);
    if(alreadySent){ showToast('You can only send one High Five per month — see you next month!'); return; }
    const fromLabel = currentDisplayName();
    state.shoutouts.push({id:uid('so'), fromId, fromLabel, toEmployeeId, message, date:todayStr()});
    logActivity(`${fromLabel} gave a high five to ${employeeById(toEmployeeId)?.name||'—'}`);
    await saveData();
    ui.showAddShoutout=false; delete ui.textDrafts['so-message']; showToast('High five sent 🙌'); render();
  };

  // weekly prep — commitments
  const btnAddCommitment = document.getElementById('btn-add-commitment');
  if(btnAddCommitment) btnAddCommitment.onclick = ()=>{ ui.showAddCommitment=!ui.showAddCommitment; render(); };
  const btnCancelCommitment = document.getElementById('btn-cancel-commitment');
  if(btnCancelCommitment) btnCancelCommitment.onclick = ()=>{ ui.showAddCommitment=false; render(); };
  const btnSaveCommitment = document.getElementById('btn-save-commitment');
  if(btnSaveCommitment) btnSaveCommitment.onclick = async ()=>{
    const employeeId = document.getElementById('cm-emp').value;
    const text = document.getElementById('cm-text').value.trim();
    if(!text){ showToast('Please enter the commitment'); return; }
    const weekStart = getWeekStart(todayStr());
    state.commitments.push({id:uid('cm'), weekStart, employeeId, text, done:false});
    await saveData();
    ui.showAddCommitment=false; showToast('Commitment added'); render();
  };
  document.querySelectorAll('[data-toggle-commitment]').forEach(cb=>{
    cb.onchange = async ()=>{
      const c = state.commitments.find(x=>x.id===cb.dataset.toggleCommitment);
      if(c){ c.done = cb.checked; await saveData(); render(); }
    };
  });

  // settings page
  const btnMigrateAuth = document.getElementById('btn-migrate-auth');
  if(btnMigrateAuth) btnMigrateAuth.onclick = migrateToSecureLogin;
  const btnClearLegacyPasswords = document.getElementById('btn-clear-legacy-passwords');
  if(btnClearLegacyPasswords) btnClearLegacyPasswords.onclick = async ()=>{
    if(!confirm('This clears the leftover plain-text passwords stored from before the Supabase Auth migration. Sign-in is unaffected — everyone already signs in through Supabase Auth, not these fields. If anyone somehow can\'t sign in afterward, reset their password from the Supabase dashboard (Authentication > Users > Send password recovery). Continue?')) return;
    state.accounts.admin.password = null;
    state.accounts.teamlead.password = null;
    if(state.accounts.ldmanager) state.accounts.ldmanager.password = null;
    state.employees.forEach(e=>{ e.password = null; });
    logActivity('Cleared leftover plain-text passwords from before the secure-login migration');
    await saveData();
    showToast('Leftover passwords cleared');
    render();
  };
  const btnToggleAnnouncement = document.getElementById('btn-toggle-announcement');
  if(btnToggleAnnouncement) btnToggleAnnouncement.onclick = ()=>{ ui.showAnnouncementForm = !ui.showAnnouncementForm; delete ui.textDrafts['announcement-text']; render(); };
  const btnCancelAnnouncement = document.getElementById('btn-cancel-announcement');
  if(btnCancelAnnouncement) btnCancelAnnouncement.onclick = ()=>{ ui.showAnnouncementForm = false; delete ui.textDrafts['announcement-text']; render(); };
  const btnSaveAnnouncement = document.getElementById('btn-save-announcement');
  if(btnSaveAnnouncement) btnSaveAnnouncement.onclick = async ()=>{
    const text = document.getElementById('announcement-text').value.trim();
    if(!text){ showToast('Write something first'); return; }
    state.announcement = {text, authorLabel: currentDisplayName(), createdAt: new Date().toISOString()};
    logActivity('Posted a team announcement');
    ui.showAnnouncementForm = false;
    delete ui.textDrafts['announcement-text'];
    await saveData();
    showToast('Announcement posted to the whole team');
    render();
  };
  const btnClearAnnouncement = document.getElementById('btn-clear-announcement');
  if(btnClearAnnouncement) btnClearAnnouncement.onclick = async ()=>{
    state.announcement = null;
    logActivity('Cleared the team announcement');
    await saveData();
    showToast('Announcement cleared');
    render();
  };
  const btnSaveAccounts = document.getElementById('btn-save-accounts');
  if(btnSaveAccounts) btnSaveAccounts.onclick = async ()=>{
    const adn = document.getElementById('set-admin-displayname').value.trim();
    const au = document.getElementById('set-admin-username').value.trim();
    const ap = document.getElementById('set-admin-password').value.trim();
    const tdn = document.getElementById('set-teamlead-displayname').value.trim();
    const tu = document.getElementById('set-teamlead-username').value.trim();
    const tp = document.getElementById('set-teamlead-password').value.trim();
    const ldn = document.getElementById('set-ldmanager-displayname').value.trim();
    const lu = document.getElementById('set-ldmanager-username').value.trim();
    const lp = document.getElementById('set-ldmanager-password').value.trim();
    if(!au || !ap || !tu || !tp){ showToast('Usernames and passwords cannot be empty'); return; }
    if((lu && !lp) || (!lu && lp)){ showToast('LD Manager username and password must both be set (or both left empty)'); return; }
    const usernames = [au, tu, ...(lu?[lu]:[])];
    if(new Set(usernames.map(u=>u.toLowerCase())).size !== usernames.length){ showToast('Admin, Team Lead, and LD Manager usernames must all be different'); return; }
    state.accounts = {
      ...state.accounts,
      admin:{username:au,password:ap,displayName:adn||'Admin'},
      teamlead:{username:tu,password:tp,displayName:tdn||'Team Lead'},
      ldmanager: lu? {username:lu,password:lp,displayName:ldn||'LD Manager'} : state.accounts.ldmanager,
    };
    logActivity('Updated Admin/Team Lead/LD Manager account credentials');
    await saveData();
    showToast('Accounts updated');
  };
  document.querySelectorAll('[data-save-emp-account]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.saveEmpAccount;
      const e = employeeById(id);
      const username = document.getElementById('emp-username-'+id).value.trim();
      const password = document.getElementById('emp-password-'+id).value.trim();
      if(!username || !password){ showToast('Username and password cannot be empty'); return; }
      const taken = username===state.accounts.admin.username || username===state.accounts.teamlead.username ||
        (state.accounts.ldmanager && username===state.accounts.ldmanager.username) ||
        state.employees.some(x=>x.id!==id && x.username===username);
      if(taken){ showToast('That username is already taken'); return; }
      if(state.authMigrated){
        alert(`Secure login is active, so passwords can't be reset from here for an existing account. In the Supabase dashboard, go to Authentication > Users, find ${authEmailFor(e.username||username)}, and use "Send password recovery" or set a new password there directly.`);
        return;
      }
      if(e){ e.username=username; e.password=password; logActivity(`Updated sign-in credentials for ${e.name}`); await saveData(); showToast(`${e.name}'s account updated`); }
    };
  });
  document.querySelectorAll('[data-create-secure-login]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.createSecureLogin;
      const e = employeeById(id);
      const usernameInput = document.getElementById('emp-username-'+id);
      const passwordInput = document.getElementById('emp-password-'+id);
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if(!username || !password){ showToast('Enter a username and password first, then create the login'); return; }
      if(e && (e.username!==username || e.password!==password)){
        e.username = username; e.password = password;
        await saveData();
      }
      b.disabled = true; b.textContent = 'Creating…';
      const res = await createAuthAccount(username, password, 'employee', id);
      if(res.ok){
        // Secure login now lives in Supabase Auth — the plaintext copy already did its one-time job, so clear it immediately rather than leaving it sitting in the data.
        if(e) e.password = null;
        logActivity(`Created secure login for ${e?.name||username}`);
        await saveData();
        showToast(`Login created for ${e?.name||username} — you'll need to sign back in now`);
        await clearSession();
        return;
      } else {
        const msg = (res.error && (res.error.message||res.error.msg)) || 'Unknown error — check the console';
        showToast(`Couldn't create login: ${msg}`);
        console.error('createAuthAccount failed for', username, res.error);
        b.disabled = false; b.textContent = 'Create secure login';
      }
    };
  });
  const btnResetData = document.getElementById('btn-reset-data');
  if(btnResetData) btnResetData.onclick = async ()=>{
    if(!confirm('This will permanently clear all tasks, reviews, audits, deliveries, check-ins, 1:1s and commitments for everyone. Team members are kept. Continue?')) return;
    state.tasks=[]; state.qualityReviews=[]; state.complianceAudits=[]; state.checkins=[]; state.commitments=[]; state.deliveries=[]; state.oneOnOnes=[];
    logActivity('Reset all operational data');
    await saveData();
    showToast('Operational data reset'); render();
  };

  // data export
  const btnExportJson = document.getElementById('btn-export-json');
  if(btnExportJson) btnExportJson.onclick = exportFullBackup;
  const btnExportTasksCsv = document.getElementById('btn-export-tasks-csv');
  if(btnExportTasksCsv) btnExportTasksCsv.onclick = exportTasksCSV;
  const btnExportBrief = document.getElementById('btn-export-brief');
  if(btnExportBrief) btnExportBrief.onclick = exportManagerBriefCSV;
  const btnExportReviewsCsv = document.getElementById('btn-export-reviews-csv');
  if(btnExportReviewsCsv) btnExportReviewsCsv.onclick = exportReviewsCSV;
  const btnExportAuditsCsv = document.getElementById('btn-export-audits-csv');
  if(btnExportAuditsCsv) btnExportAuditsCsv.onclick = exportAuditsCSV;

  // reports filters
  const rfEmp = document.getElementById('rf-emp');
  if(rfEmp) rfEmp.onchange = ()=>{ ui.reportFilterEmp = rfEmp.value; render(); };
  const rfType = document.getElementById('rf-type');
  if(rfType) rfType.onchange = ()=>{ ui.reportFilterType = rfType.value; render(); };
  const rfStatus = document.getElementById('rf-status');
  if(rfStatus) rfStatus.onchange = ()=>{ ui.reportFilterStatus = rfStatus.value; render(); };
}

function isFormOpen(){
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return true;
  return !!(ui.showAddEmployee||ui.showAddTask||ui.completingTask||ui.showAddReview||ui.showAddAudit||ui.showAddCheckin||ui.showAddCommitment||ui.showAddDelivery||ui.showAddOneOnOne||ui.showPickTask||ui.showAddRequest||ui.approvingTask||ui.editingTask);
}
// Applies a single realtime row change (from one table) directly onto the matching in-memory array,
// instead of reloading everything — this is the per-record equivalent of applyRemoteUpdate().
function applyRealtimeRow(stateKey, eventType, newRow, oldRow){
  const arr = state[stateKey];
  if(!Array.isArray(arr)) return;
  if(eventType==='DELETE'){
    const id = oldRow && oldRow.id;
    if(!id) return;
    state[stateKey] = arr.filter(r=>r.id!==id);
    if(lastSyncedSnapshot && lastSyncedSnapshot[stateKey]) lastSyncedSnapshot[stateKey].delete(id);
  } else {
    const rec = (newRow && newRow.data && typeof newRow.data==='object') ? {...newRow.data, id: newRow.data.id || newRow.id} : null;
    if(!rec) return;
    const idx = arr.findIndex(r=>r.id===rec.id);
    if(idx>=0) arr[idx] = rec; else arr.push(rec);
    if(lastSyncedSnapshot && lastSyncedSnapshot[stateKey]) lastSyncedSnapshot[stateKey].set(rec.id, {json: JSON.stringify(rec), updatedAt: newRow.updated_at || null});
  }
}
function applyRealtimeSettings(eventType, newRow){
  if(eventType==='DELETE') return;
  const d = newRow && newRow.data;
  if(!d) return;
  state.accounts = d.accounts || state.accounts;
  state.authMigrated = !!d.authMigrated;
  state.announcement = d.announcement || null;
  state.trainingTopics = d.trainingTopics || state.trainingTopics;
  if(lastSyncedSnapshot) lastSyncedSnapshot.__settings = {json: JSON.stringify({accounts:state.accounts, authMigrated:state.authMigrated, announcement:state.announcement, trainingTopics:state.trainingTopics}), updatedAt: newRow.updated_at || null};
}
function subscribeRealtime(){
  try{
    const channel = sbClient.channel('db_changes');
    Object.keys(TABLE_MAP).forEach(stateKey=>{
      const table = TABLE_MAP[stateKey];
      channel.on('postgres_changes', {event:'*', schema:'public', table}, (payload)=>{
        if(Date.now() - lastSaveAt < 1500) return; // almost certainly the echo of our own write — we already have the freshest data
        const apply = ()=>{ applyRealtimeRow(stateKey, payload.eventType, payload.new, payload.old); render(); };
        if(isFormOpen()){ showToast('Data updated elsewhere — will refresh shortly'); setTimeout(apply, 4000); return; }
        setTimeout(apply, 400); // small settling delay so nothing races the just-committed write
      });
    });
    channel.on('postgres_changes', {event:'*', schema:'public', table:'app_settings', filter:'id=eq.main'}, (payload)=>{
      if(Date.now() - lastSaveAt < 1500) return;
      const apply = ()=>{ applyRealtimeSettings(payload.eventType, payload.new); render(); };
      if(isFormOpen()){ setTimeout(apply, 4000); return; }
      setTimeout(apply, 400);
    });
    channel.subscribe();
  }catch(e){ console.error('Realtime subscribe failed:', e); }
}

(async function init(){
  if(!sbClient){
    document.getElementById('root').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
        <div style="max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 28px;text-align:center">
          <h1 style="font-size:17px;margin:0 0 10px">${supabaseInitError? 'Could not connect to Supabase' : 'Almost there — connect Supabase'}</h1>
          <p style="color:var(--text-dim);font-size:13.5px;line-height:1.7;margin:0">
            ${supabaseInitError? escapeHtml(supabaseInitError) : `
              This copy of the system isn't connected to a database yet.
              Open the HTML file, find <code style="background:var(--surface-2);padding:2px 6px;border-radius:5px">SUPABASE_URL</code> and
              <code style="background:var(--surface-2);padding:2px 6px;border-radius:5px">SUPABASE_ANON_KEY</code> near the top of the script,
              and fill them in with your Supabase project's values.
            `}
          </p>
        </div>
      </div>`;
    return;
  }
  try{
    await loadSession();
    if(!session) await loadAccountSettings(); // no saved session yet — need real accounts/authMigrated before the login form can check anything
    renderApp(); // show the login screen (or app shell) immediately — doesn't need the full data set yet
    if(session){
      showToast('Loading your data…');
      try{ await sbClient.auth.getSession(); }catch(e){}
      await loadData();
      if((session.role==='admin' || session.role==='teamlead') && autoArchiveExpiredPipeline()) await saveData();
      render(); // refresh the already-visible shell now that real data has arrived
      subscribeRealtime();
    }
  }catch(e){
    console.error('Startup error:', e);
    document.getElementById('root').innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
        <div style="max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 28px;text-align:center">
          <h1 style="font-size:17px;margin:0 0 10px">Something went wrong on startup</h1>
          <p style="color:var(--text-dim);font-size:13.5px;line-height:1.7;margin:0">${escapeHtml(e.message||String(e))}</p>
        </div>
      </div>`;
  }
})();
</script>
