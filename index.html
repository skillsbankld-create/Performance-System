<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L&amp;D Pulse — Skills Bank</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.1/dist/umd/supabase.js"></script>
<!-- Used by LXD Officer's upload flow to unzip a .pptx and extract its text/images IN THE BROWSER,
     before anything is uploaded — see lxdExtractPptxContent() and the big comment in
     supabase_functions/lxd-officer-ingest/index.ts for why this moved out of the Edge Function. -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* brand palette */
    --bg:#080828;
    --surface:#0E1038;
    --surface-2:#151848;
    --surface-3:#1D2158;
    --border:#2B2F6B;
    --text:#EBF4FF;
    --text-dim:#9AA3D6;
    --text-faint:#666EA0;
    --teal:#40BDA9;
    --teal-dim:rgba(64,189,169,.16);
    --amber:#FFBC3A;
    --amber-dim:rgba(255,188,58,.16);
    --rose:#F26A44;
    --rose-dim:rgba(242,106,68,.16);
    --indigo:#4D88E8;
    --indigo-dim:rgba(77,136,232,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 550px at 85% -10%, rgba(77,136,232,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(64,189,169,.06), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Cairo',sans-serif;}
  ::selection{background:var(--indigo-dim);}
  a{color:inherit;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}

  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:250px;flex:0 0 250px;
    background:linear-gradient(180deg, var(--surface), rgba(18,27,46,.7));
    border-right:1px solid var(--border);
    padding:22px 18px;display:flex;flex-direction:column;gap:26px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;flex-direction:column;gap:8px;padding:0 4px;}
  .brand-logo{width:100%;max-width:190px;height:auto;display:block;}
  .brand .sub{font-size:11.5px;color:var(--text-faint);}

  nav.nav{display:flex;flex-direction:column;gap:4px;}
  .nav button{
    all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;color:var(--text-dim);font-size:14.5px;font-weight:500;
    transition:.15s;
  }
  .nav button:hover{background:var(--surface-2);color:var(--text);}
  .nav button.active{background:var(--indigo-dim);color:#C8CEFF;font-weight:700;}
  .nav button .ic{width:17px;text-align:center;opacity:.85;font-size:14px;}

  .sidebar-foot{margin-top:auto;font-size:11px;color:var(--text-faint);padding:0 4px;line-height:1.7;}

  main{flex:1;padding:30px 34px 60px;max-width:1320px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  .page-head h1{font-size:23px;margin:0 0 4px;font-weight:800;}
  .page-head p{margin:0;color:var(--text-dim);font-size:13.5px;}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;position:relative;overflow:hidden;}
  .kpi .lbl{font-size:12px;color:var(--text-dim);margin-bottom:8px;}
  .kpi .val{font-family:'Cairo',sans-serif;font-size:25px;font-weight:800;}
  .kpi .val small{font-size:13px;color:var(--text-dim);font-weight:500;margin-left:3px;}
  .kpi.teal{border-color:rgba(64,189,169,.35);}
  .kpi.teal .val{color:var(--teal);}
  .kpi.rose .val{color:var(--rose);}
  .kpi.amber .val{color:var(--amber);}
  .kpi.indigo{border-color:rgba(77,136,232,.35);}
  .kpi.indigo .val{color:var(--indigo);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;position:relative;overflow:hidden;}
  .card h3{margin:0 0 3px;font-size:15.5px;font-weight:700;}
  .card .hint{font-size:12.5px;color:var(--text-dim);margin:0 0 16px;}
  .card.accent-indigo{border-top:3px solid var(--indigo);}
  .card.accent-teal{border-top:3px solid var(--teal);}
  .card.accent-amber{border-top:3px solid var(--amber);}
  .card.accent-rose{border-top:3px solid var(--rose);}
  .card.accent-indigo::before,.card.accent-teal::before,.card.accent-amber::before,.card.accent-rose::before{
    content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle, currentColor, transparent 70%);opacity:.06;pointer-events:none;
  }
  .card.accent-indigo::before{color:var(--indigo);}
  .card.accent-teal::before{color:var(--teal);}
  .card.accent-amber::before{color:var(--amber);}
  .card.accent-rose::before{color:var(--rose);}

  .pulse-wrap{position:relative;background:linear-gradient(180deg, var(--surface), var(--surface-2));border:1px solid var(--border);border-radius:var(--radius);padding:22px 22px 16px;margin-bottom:22px;overflow:hidden;}
  .pulse-wrap .pulse-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .pulse-wrap .pulse-title{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;}
  .pulse-wrap .pulse-title .live{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 10px var(--teal);animation:blip 1.6s infinite;}
  @keyframes blip{0%,100%{opacity:1;}50%{opacity:.25;}}
  .pulse-status{font-size:12.5px;color:var(--text-dim);}
  .pulse-bars{display:flex;align-items:flex-end;gap:3px;height:70px;position:relative;}
  .pulse-bar{flex:1;min-width:3px;border-radius:3px 3px 0 0;background:var(--surface-3);transition:.3s;}
  .pulse-sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);width:40%;animation:sweep 3.2s linear infinite;}
  @keyframes sweep{0%{transform:translateX(-120%);}100%{transform:translateX(320%);}}
  .pulse-empty{color:var(--text-faint);font-size:13px;padding:14px 2px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.table-sm{font-size:11.5px;}
  table.table-sm th{padding:5px 8px;font-size:10px;}
  table.table-sm td{padding:5px 8px;}
  th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:9px 10px;border-bottom:1px solid var(--border);}
  td{padding:11px 10px;border-bottom:1px solid rgba(37,48,83,.6);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.rowlink{cursor:pointer;transition:.12s;}
  tr.rowlink:hover{background:var(--surface-2);}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--surface-3);font-weight:700;font-size:12px;color:var(--text-dim);}
  .rank.gold{background:linear-gradient(135deg,#F5C453,#C9862B);color:#2a1a02;}
  .rank.silver{background:linear-gradient(135deg,#D9E1EE,#9AA7C0);color:#1a2233;}
  .rank.bronze{background:linear-gradient(135deg,#E3A06B,#A15C2E);color:#2a1503;}
  .who{display:flex;align-items:center;gap:9px;}
  .avatar{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;font-family:'Cairo',sans-serif;flex:0 0 30px;overflow:hidden;}
  .who .nm{font-weight:600;}
  .who .rl{font-size:11.5px;color:var(--text-faint);}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700;font-family:'Cairo',sans-serif;}
  .badge.pos{background:var(--teal-dim);color:var(--teal);}
  .badge.neg{background:var(--rose-dim);color:var(--rose);}
  .badge.zero{background:var(--surface-3);color:var(--text-dim);}
  .badge.amber{background:var(--amber-dim);color:var(--amber);}
  .tag{display:inline-block;padding:3px 9px;border-radius:7px;background:var(--surface-3);color:var(--text-dim);font-size:11.5px;}
  .dna-link{color:var(--indigo);text-decoration:none;font-weight:600;}
  .dna-link:hover{text-decoration:underline;}
  .status-pill{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .status-pill.open{background:var(--amber-dim);color:var(--amber);}
  .status-pill.done{background:var(--teal-dim);color:var(--teal);}
  .status-pill.overdue{background:var(--rose-dim);color:var(--rose);}
  .status-pill.pending{background:var(--indigo-dim);color:var(--indigo);}

  .bar-row{display:grid;grid-template-columns:150px 1fr 60px;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .bar-track{height:9px;background:var(--surface-3);border-radius:6px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:6px;}

  .btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:700;transition:.15s;}
  .btn-primary{background:var(--indigo);color:#fff;}
  .btn-primary:hover{background:#3f78d9;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-3);}
  .btn-danger{background:var(--rose-dim);color:var(--rose);}
  .btn-danger:hover{background:rgba(242,106,68,.28);}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end;}
  label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 11px;border-radius:9px;font-size:13.5px;outline:none;transition:.15s;
  }
  input:focus,select:focus,textarea:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-dim);}
  .form-actions{display:flex;gap:8px;margin-top:14px;}

  .empty-state{padding:34px 20px;text-align:center;color:var(--text-dim);}
  .empty-state .big{font-size:30px;margin-bottom:8px;}
  .empty-state .t{font-weight:700;color:var(--text);margin-bottom:4px;font-family:'Cairo',sans-serif;}
  .empty-state .d{font-size:13px;margin-bottom:14px;}

  .inline-form{background:var(--surface-2);border:1px dashed var(--border);border-radius:10px;padding:12px;margin-top:8px;display:flex;gap:10px;align-items:end;flex-wrap:wrap;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .filters select{width:auto;min-width:150px;}
  .month-filter-select{width:auto;min-width:170px;}
  @keyframes announceIn{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes announceShineOnce{0%{transform:translateX(-120%) skewX(-15deg);}100%{transform:translateX(220%) skewX(-15deg);}}
  @keyframes announceBadgeIn{0%{transform:scale(.5);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);opacity:1;}}
  .announcement-banner{
    position:relative;overflow:hidden;border-radius:14px;margin-bottom:22px;
    background:linear-gradient(135deg, #141b32, #1b2340);
    border:1px solid rgba(255,255,255,.08);
    border-left:4px solid var(--teal);
    box-shadow:0 10px 28px rgba(0,0,0,.35);
    animation:announceIn .5s cubic-bezier(.16,1,.3,1);
  }
  .announcement-banner::after{
    content:'';position:absolute;top:0;left:0;width:35%;height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.06), transparent);
    animation:announceShineOnce 1.6s ease-out .3s 1;pointer-events:none;
  }
  .announcement-banner .inner{position:relative;z-index:1;padding:20px 24px;}
  .announcement-banner .badge-ic{
    flex:0 0 auto;width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg, var(--teal), var(--indigo));
    display:flex;align-items:center;justify-content:center;font-size:17px;
    animation:announceBadgeIn .5s cubic-bezier(.34,1.56,.64,1) .15s backwards;
    box-shadow:0 4px 14px rgba(64,189,169,.35);
  }

  .grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;}
  @media(max-width:980px){.grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;}}

  .profile-head{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .profile-head .avatar{width:64px;height:64px;border-radius:16px;font-size:22px;flex:0 0 64px;}
  .profile-head h2{margin:0 0 3px;font-size:20px;}
  .profile-head .role{color:var(--text-dim);font-size:13px;}
  .photo-btn{margin-top:6px;}
  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;cursor:pointer;margin-bottom:14px;}
  .back-link:hover{color:var(--text);}

  .stat-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
  .stat-mini .box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 13px;}
  .stat-mini .box .l{font-size:11px;color:var(--text-faint);margin-bottom:4px;}
  .stat-mini .box .v{font-family:'Cairo',sans-serif;font-weight:800;font-size:18px;}

  .weight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .weight-grid .wlabel{font-size:11.5px;color:var(--text-dim);margin-bottom:5px;}
  .weight-grid .wsub{font-size:10.5px;color:var(--text-faint);}

  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex:none;height:auto;max-height:none;position:relative;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:visible;padding:12px 14px;border-right:none;border-bottom:1px solid var(--border);gap:14px;}
    .brand{flex-direction:row;align-items:center;gap:10px;flex:0 0 auto;}
    .brand-logo{max-width:120px;}
    .brand .sub{display:none;}
    .brand-title{display:none;}
    nav.nav{flex-direction:row;gap:6px;flex:0 0 auto;}
    .nav button{padding:9px 12px;font-size:13px;white-space:nowrap;}
    .sidebar-foot{display:none;}
    #btn-logout{flex:0 0 auto;margin-top:0 !important;white-space:nowrap;}
    main{padding:18px 14px 60px;}
    .page-head{align-items:flex-start;}
    .page-head h1{font-size:20px;}
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:10px;}
    .kpi{padding:13px 14px;}
    .kpi .val{font-size:21px;}
    .grid-2{gap:14px;}
    .card{padding:16px;overflow-x:auto;}
    table{font-size:12.5px;}
    th,td{padding:9px 8px;}
    .form-grid{grid-template-columns:1fr;}
    .weight-grid{grid-template-columns:1fr 1fr;}
    .stat-mini{grid-template-columns:repeat(2,1fr);}
    input[type=text],input[type=number],input[type=date],input[type=password],select,textarea,.btn{min-height:40px;}
    .btn{padding:10px 16px;}
    .btn-sm{min-height:34px;padding:7px 12px;}
    .profile-head{align-items:flex-start;}
    .inline-form{padding:14px;}
  }
  @media(max-width:480px){
    .kpi-row{grid-template-columns:1fr 1fr;}
    .stat-mini{grid-template-columns:1fr 1fr;}
    .weight-grid{grid-template-columns:1fr;}
    main{padding:14px 10px 60px;}
    .card{padding:14px;}
  }
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);padding:11px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

  const catScores = {};
  D3_CHECKLIST.forEach(cat=>{
    let p=0,t=0;
    cat.items.forEach(it=>{
      const v = checkpoints[it.code];
      if(v==='pass'){p++;t++;passed++;total++;}
      else if(v==='fail'){t++;total++;}
    });
    catScores[cat.key] = t? Math.round((p/t)*100) : null;
  });
  const overallPct = total? Math.round((passed/total)*100) : 0;
  return {catScores, overallPct};
}
function tier1Failures(checkpoints){
  const fails=[];
  D3_CHECKLIST.forEach(cat=>cat.items.forEach(it=>{ if(it.tier===1 && checkpoints[it.code]==='fail') fails.push(it.code); }));
  return fails;
}
function monthsBetween(a,b){
  const d1=new Date(a+'T00:00:00'), d2=new Date(b+'T00:00:00');
  return Math.max(0,(d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth()));
}
function computeTriggers(){
  const triggers = [];
  state.qualityReviews.forEach(r=>{
    if(r.scores && r.scores.transfer===1){
      triggers.push({code:'Q1', severity:'IMMEDIATE', text:`Transfer Design hard stop — ${employeeById(r.employeeId)?.name||'—'} — "${r.program}" (${fmtDate(r.date)})`});
    }
  });
  state.employees.forEach(e=>{
    const revs = state.qualityReviews.filter(r=>r.employeeId===e.id).sort((a,b)=>new Date(a.date)-new Date(b.date));
    for(let i=0;i+2<revs.length;i++){
      const win = revs.slice(i,i+3);
      const avg = win.reduce((s,r)=>s+r.pct,0)/3;
      if(avg<80){
        triggers.push({code:'Q2', severity:'URGENT', text:`${e.name} — average quality score below 80% across 3 consecutive reviews (${avg.toFixed(0)}%)`});
        break;
      }
    }
  });
  const latestAudit = state.complianceAudits.slice().sort((a,b)=> new Date(b.year,b.month)-new Date(a.year,a.month))[0];
  if(latestAudit){
    if(latestAudit.tier1Fails && latestAudit.tier1Fails.length){
      triggers.push({code:'O1', severity:'IMMEDIATE', text:`Tier 1 checkpoint failure this month: ${latestAudit.tier1Fails.join(', ')}`});
    }
    if(typeof latestAudit.overallPct==='number' && latestAudit.overallPct<90){
      triggers.push({code:'O2', severity:'URGENT', text:`Monthly compliance score is ${latestAudit.overallPct}% — below the 90% standard`});
    }
  }
  state.employees.forEach(e=>{
    if(e.tierStartDate){
      const months = monthsBetween(e.tierStartDate, todayStr());
      if(months>=12){
        triggers.push({code:'P4', severity:'SCHEDULED', text:`${e.name} has been in their current tier for ${months} months — eligible for an advancement review`});
      }
    }
  });
  state.oneOnOnes.forEach(o=>{
    (o.actions||[]).forEach(a=>{
      if(a.dueDate && !a.done && a.dueDate < todayStr()){
        triggers.push({code:'P3', severity:'URGENT', text:`${employeeById(o.employeeId)?.name||'—'} — action item overdue: "${a.text}" (was due ${fmtDate(a.dueDate)})`});
      }
    });
  });
  state.tasks.forEach(t=>{
    if(t.paused && t.slackDeliveryTime && t.pausedAt && t.plannedResumeAt){
      const slackDate = t.slackDeliveryTime.slice(0,10);
      if(slackDate>=t.pausedAt && slackDate<=t.plannedResumeAt){
        triggers.push({code:'T1', severity:'IMMEDIATE', text:`"${t.title}" (${employeeById(t.assigneeId)?.name||'—'}) is paused ${fmtDate(t.pausedAt)}–${fmtDate(t.plannedResumeAt)}, but its Slack delivery time (${fmtDate(slackDate)}) falls inside that pause window`});
      }
    }
  });
  return triggers;
}

  return dt.toISOString().slice(0,10);
}

// Every render() rebuilds the whole page from these template strings, so a plain `${escapeHtml(seed)}`
// textarea value gets reset to that seed on ANY re-render — including one triggered by something
// completely unrelated elsewhere on the page (another button, another save) while someone is still
// mid-sentence, silently wiping what they typed. taVal() + bindTextDrafts() fix that: every textarea's
// value comes from a small live draft store (ui.textDrafts, keyed by the textarea's own id) that only
// this element's own keystrokes update, so re-renders elsewhere can't touch it. Call taVal(id, seed) for

// whoever owns that form (delete ui.textDrafts['the-id']).

function isWeekendDay(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const day = new Date(Date.UTC(y,m-1,d)).getUTCDay(); // 0=Sun ... 5=Fri, 6=Sat
  return day===5 || day===6;
}
function addBusinessDays(dateStr, n){
  if(!dateStr || !isFinite(n)) return dateStr;
  let d = dateStr;
  let remaining = Math.min(Math.abs(n), 3650);
  const step = n>=0 ? 1 : -1;
  let guard = 0;
  while(remaining>0 && guard<20000){
    d = addDays(d, step);
    if(!isWeekendDay(d)) remaining--;
    guard++;
  }
  return d;
}
function businessDayDiff(a, b){
  if(!a || !b) return 0;
  if(a===b) return 0;
  const sign = a>b ? 1 : -1;
  const lo = sign===1? b : a;
  const hi = sign===1? a : b;
  let count = 0, cur = lo, guard = 0;
  while(cur < hi && guard<20000){
    cur = addDays(cur, 1);
    if(!isWeekendDay(cur)) count++;
    guard++;
  }
  return count*sign;
}
function businessDaysInclusive(aStr, bStr){
  if(!aStr || !bStr) return 0;
  const lo = aStr<=bStr? aStr : bStr;
  const hi = aStr<=bStr? bStr : aStr;
  let count = 0, cur = lo, guard = 0;
  while(cur<=hi && guard<20000){
    if(!isWeekendDay(cur)) count++;
    cur = addDays(cur,1);
    guard++;
  }
  return count;
}

// ====== Per-record persistence layer ======
// Each table holds independent rows (id + data jsonb + updated_at). We never read-all/merge-guess/write-all-over
// anymore — every save diffs the in-memory state against a snapshot of what we last knew was on the server and
// issues one atomic insert/update/delete per row that actually changed. Each snapshot entry also remembers the
// row's server `updated_at`, so if two people edit the *same* record at the same moment, the second save can
// detect that the row moved under it (optimistic locking) instead of silently overwriting the first person's work.
let lastSyncedSnapshot = null; // { [stateKey]: Map(id -> {json, updatedAt}) , __settings: {json, updatedAt} }
function snapshotState(rowUpdatedAt){
  // rowUpdatedAt (optional): { [stateKey]: Map(id->updated_at), __settings: updated_at } — real server timestamps,
  // passed in right after a load. When omitted (e.g. right after our own save), updatedAt is left null for
  // anything we don't already know a fresh timestamp for.
  const snap = {};
  Object.keys(TABLE_MAP).forEach(key=>{
    const m = new Map();
    const tsMap = rowUpdatedAt && rowUpdatedAt[key];
    (Array.isArray(state[key])?state[key]:[]).forEach(r=>{
      if(r && r.id) m.set(r.id, {json: JSON.stringify(r), updatedAt: tsMap ? (tsMap.get(r.id)||null) : null});
    });
    snap[key] = m;
  });
  snap.__settings = {json: JSON.stringify({accounts:state.accounts, authMigrated:state.authMigrated, announcement:state.announcement, trainingTopics:state.trainingTopics, trainers:state.trainers}), updatedAt: (rowUpdatedAt && rowUpdatedAt.__settings) || null};
  return snap;
}
// Writes one row. If expectedUpdatedAt is given, first checks the row hasn't been touched by someone else
// since we last saw it — if it has, returns {conflict:true} instead of overwriting.
async function dbUpsertRow(table, id, data, expectedUpdatedAt){
  if(expectedUpdatedAt){
    const { data: cur, error: checkErr } = await sbClient.from(table).select('updated_at').eq('id', id).maybeSingle();
    if(!checkErr && cur && cur.updated_at && cur.updated_at !== expectedUpdatedAt){
      return {ok:false, conflict:true};
    }
  }
  const { data: written, error } = await sbClient.from(table).upsert({id, data, updated_at:new Date().toISOString()}).select('updated_at').single();
  if(error){ console.error(`Supabase upsert error [${table}/${id}]:`, JSON.stringify(error, null, 2), error.message, error.details, error.hint, error.code); showToast('Could not save — check your Supabase connection'); return {ok:false, conflict:false}; }
  return {ok:true, conflict:false, updatedAt: written ? written.updated_at : null};
}
async function dbDeleteRow(table, id){
  const { error } = await sbClient.from(table).delete().eq('id', id);
  if(error){ console.error(`Supabase delete error [${table}/${id}]:`, JSON.stringify(error, null, 2), error.message, error.details, error.hint, error.code); showToast('Could not delete — check your Supabase connection'); return {ok:false, conflict:false}; }
  return {ok:true, conflict:false};
}

async function loadData(){
  try{
    const tableKeys = Object.keys(TABLE_MAP);
    const results = await Promise.all(tableKeys.map(k=>sbClient.from(TABLE_MAP[k]).select('id,data,updated_at')));
    const unseeded = new Set(); // tables that came back empty — keep in-code defaults and seed them on next save
    const rowUpdatedAt = {};
    results.forEach((res,i)=>{
      const key = tableKeys[i];
      const table = TABLE_MAP[key];
      if(res.error){ console.error(`Supabase load error [${table}]:`, JSON.stringify(res.error, null, 2), res.error.message, res.error.details, res.error.hint, res.error.code); return; }
      const rows = res.data || [];
      if(rows.length===0){ unseeded.add(key); return; }
      state[key] = rows.map(row => (row.data && typeof row.data==='object') ? {...row.data, id: row.data.id || row.id} : null).filter(Boolean);
      rowUpdatedAt[key] = new Map(rows.map(row=>[ (row.data && row.data.id) || row.id, row.updated_at ]));
    });
    const { data: settingsRow, error: settingsErr } = await sbClient.from('app_settings').select('data,updated_at').eq('id','main').single();
    let settingsUnseeded = false;
    if(settingsErr && settingsErr.code!=='PGRST116') console.error('Supabase load error [app_settings]:', JSON.stringify(settingsErr, null, 2), settingsErr.message, settingsErr.details, settingsErr.hint, settingsErr.code);
    if(settingsRow && settingsRow.data){
      state.accounts = settingsRow.data.accounts || state.accounts;
      state.authMigrated = !!settingsRow.data.authMigrated;
      state.announcement = settingsRow.data.announcement || null;
      state.trainingTopics = settingsRow.data.trainingTopics || state.trainingTopics;
      state.trainers = settingsRow.data.trainers || state.trainers;
      rowUpdatedAt.__settings = settingsRow.updated_at;
    } else { settingsUnseeded = true; }
    state.employees.forEach(e=>{
      if(e.hireDate===undefined) e.hireDate=null;
      if(e.wfhDays===undefined) e.wfhDays=[];
      if(e.annualLeaveBalance===undefined) e.annualLeaveBalance=21;
      if(e.username===undefined) e.username=null;
      if(e.password===undefined) e.password=null;
    });
    // taskTypes always come from the current code catalog
    lastSyncedSnapshot = snapshotState(rowUpdatedAt);
    unseeded.forEach(key=>{ lastSyncedSnapshot[key] = new Map(); }); // force these rows to be treated as new on next save
    if(settingsUnseeded) lastSyncedSnapshot.__settings = {json: undefined, updatedAt: null};
    if(session && (unseeded.size>0 || settingsUnseeded)){
      // genuinely fresh database (or a table that's still empty) — persist the in-code defaults now,
      // one atomic row insert per record, so future saves have something to diff against
      await saveData();

let lastSaveAt = 0;
let lastSyncAt = null; // ISO timestamp of the last successful load or save — shown in the sidebar footer
async function saveData(){
  try{
    const prev = lastSyncedSnapshot || snapshotState();
    const ops = []; // {key, id, kind, promise}
    Object.keys(TABLE_MAP).forEach(key=>{
      const table = TABLE_MAP[key];
      const prevMap = prev[key] || new Map();
      const curArr = Array.isArray(state[key]) ? state[key] : [];
      const curIds = new Set();
      curArr.forEach(r=>{
        if(!r || !r.id) return;
        curIds.add(r.id);
        const prevEntry = prevMap.get(r.id);
        const js = JSON.stringify(r);
        if(!prevEntry || prevEntry.json !== js){
          // no prevEntry (brand-new record) or unknown updatedAt (e.g. just seeded) → nothing to check against yet
          const expected = prevEntry ? prevEntry.updatedAt : null;
          ops.push({key, id:r.id, kind:'upsert', promise: dbUpsertRow(table, r.id, r, expected)});
        }
      });
      prevMap.forEach((_, id)=>{ if(!curIds.has(id)) ops.push({key, id, kind:'delete', promise: dbDeleteRow(table, id)}); });
    });
    const settingsJs = JSON.stringify({accounts:state.accounts, authMigrated:state.authMigrated, announcement:state.announcement, trainingTopics:state.trainingTopics, trainers:state.trainers});
    if(prev.__settings.json !== settingsJs){
      ops.push({key:'__settings', id:'main', kind:'upsert', promise: dbUpsertRow('app_settings','main', {accounts:state.accounts, authMigrated:state.authMigrated, announcement:state.announcement, trainingTopics:state.trainingTopics, trainers:state.trainers}, prev.__settings.updatedAt)});
    }
    const results = await Promise.all(ops.map(o=>o.promise));
    lastSaveAt = Date.now();
    lastSyncAt = new Date(lastSaveAt).toISOString();
    // Rebuild the snapshot from current state, then stamp in the real server updated_at for whatever we just wrote successfully.
    lastSyncedSnapshot = snapshotState();
    const conflicts = [];
    results.forEach((res, i)=>{
      const o = ops[i];
      if(res && res.conflict){ conflicts.push(o); return; }
      if(!res || !res.ok || o.kind==='delete') return;
      if(o.key==='__settings'){ lastSyncedSnapshot.__settings.updatedAt = res.updatedAt; return; }
      const entry = lastSyncedSnapshot[o.key].get(o.id);
      if(entry) entry.updatedAt = res.updatedAt;
    });
    if(conflicts.length) await resolveSaveConflicts(conflicts);
  }catch(e){ console.error('saveData failed:', e); showToast('Could not save — check your Supabase connection'); }
}
// Someone else saved the exact same row between our last sync and now. Pull their version in so we don't
// keep clobbering it on every retry, and tell the person so they can knowingly redo their change if still needed.
async function resolveSaveConflicts(conflicts){
  const labels = [];
  for(const c of conflicts){
    if(c.key==='__settings'){
      const { data } = await sbClient.from('app_settings').select('data,updated_at').eq('id','main').single();
      if(data){
        // A conflict on this row almost always means someone else's login/migration touched
        // accounts/authMigrated — adopt those from the server, but keep OUR OWN announcement/
        // trainingTopics/trainers exactly as they are locally (that's the whole point of resolving
        // the conflict, not silently losing whatever we were doing — e.g. approving a new Trainer
        // DNA profile), then immediately re-save the merged row so it actually lands on the server
        // instead of just being marked "already synced" without ever being written.
        state.accounts = data.data.accounts || state.accounts;
        state.authMigrated = !!data.data.authMigrated;
        const merged = {accounts:state.accounts, authMigrated:state.authMigrated, announcement:state.announcement, trainingTopics:state.trainingTopics, trainers:state.trainers};
        const retry = await dbUpsertRow('app_settings','main', merged, data.updated_at);
        lastSyncedSnapshot.__settings = {json: JSON.stringify(merged), updatedAt: retry.ok ? retry.updatedAt : data.updated_at};
      }
      labels.push('Account settings');
      continue;
    }
    const table = TABLE_MAP[c.key];
    const { data } = await sbClient.from(table).select('data,updated_at').eq('id', c.id).maybeSingle();
    if(data){
      const rec = {...data.data, id: data.data.id || c.id};
      const arr = state[c.key];
      const idx = arr.findIndex(r=>r.id===rec.id);
      if(idx>=0) arr[idx]=rec; else arr.push(rec);
      lastSyncedSnapshot[c.key].set(rec.id, {json: JSON.stringify(rec), updatedAt: data.updated_at});
      labels.push(rec.title || rec.name || rec.text || rec.program || c.id);
    } else {
      // the record was deleted by someone else in the meantime
      state[c.key] = state[c.key].filter(r=>r.id!==c.id);
      lastSyncedSnapshot[c.key].delete(c.id);
      labels.push(c.id);
    }
  }
  showToast(conflicts.length===1
    ? `Someone else just updated this at the same time — your view has been refreshed with their version. Please redo your change if still needed.`
    : `Someone else just updated ${conflicts.length} of these records at the same time — your view has been refreshed. Please redo your changes if still needed.`);
  render();
}

/* ============ derived data ============ */
function employeeById(id){ return state.employees.find(e=>e.id===id); }
function typeById(id){ return state.taskTypes.find(t=>t.id===id); }
function tasksFor(empId){ return state.tasks.filter(t=>t.assigneeId===empId); }

const HOURS_PER_DAY = 8; // standard working day — used to convert the day-based deadline gap into hours
function computeTaskHoursDiff(task){
  if(task.status!=='done' || !task.completedDate) return null;
  const days = businessDayDiff(task.deadline, task.completedDate); // + early, - late — working days only (Fri/Sat excluded)
  return Math.round(days * HOURS_PER_DAY * 10)/10;
}
function fmtHours(n){
  const r = Math.round(Math.abs(n||0)*10)/10;
  return (Number.isInteger(r) ? String(r) : r.toFixed(1))+'h';
}
function timeBalanceBadge(hours){
  const h = Math.round((hours||0)*10)/10;
  if(h>0) return `<span class="badge pos">+${fmtHours(h)} Buffer</span>`;
  if(h<0) return `<span class="badge neg">${fmtHours(h)} Shrinkage</span>`;
  return `<span class="badge zero">On pace</span>`;
}
function monthLabelFromKey(k){
  const [y,m] = k.split('-');
  return MONTH_NAMES[Number(m)]+' '+y;
}
function employeeMonthlyTime(empId){
  const done = tasksFor(empId).filter(t=>t.status==='done' && t.completedDate);
  const byMonth = {};
  done.forEach(t=>{
    const k = monthKey(t.completedDate);
    byMonth[k] = (byMonth[k]||0) + (computeTaskHoursDiff(t)||0);
  });
  return Object.keys(byMonth).sort().map(k=>({key:k, label: monthLabelFromKey(k), netHours: Math.round(byMonth[k]*10)/10}));
}
function employeeMonitoringHours(empId, mKey){
  return state.monitoringLogs
    .filter(m=>m.employeeId===empId && (!mKey || monthKey(m.date)===mKey) && (m.status==='approved' || m.status===undefined))
    .reduce((s,m)=>s+(Number(m.hours)||0), 0);
}
function employeeMonitoringHoursMonthlyHistory(empId){
  const logs = state.monitoringLogs.filter(m=>m.employeeId===empId && (m.status==='approved' || m.status===undefined));
  const byMonth = {};
  logs.forEach(m=>{ const k=monthKey(m.date); byMonth[k]=(byMonth[k]||0)+(Number(m.hours)||0); });
  return Object.keys(byMonth).sort().map(k=>({key:k, label:monthLabelFromKey(k), hours:Math.round(byMonth[k]*10)/10}));
}
function computeHeroesScore(empId, period){
  const todayKey = monthKey(todayStr());
  const isYtd = period==='ytd';
  const mKey = isYtd? todayKey : (period || todayKey); // mKey is still used as the "as of" reference month for YTD's upper bound
  const yearPrefix = todayKey.slice(0,4); // YTD always means the current calendar year, regardless of which month is being browsed
  const inPeriod = (dateStr)=>{
    if(!dateStr) return false;
    const k = monthKey(dateStr);
    return isYtd? (k.slice(0,4)===yearPrefix && k<=todayKey) : (k===mKey);
  };
  const monthKeyInPeriod = (mk)=> isYtd? (mk.slice(0,4)===yearPrefix && mk<=todayKey) : (mk===mKey);
  const isLiveCurrentMonth = !isYtd && mKey===todayKey; // only the real "right now" gets the no-data-yet safety net below

  // 1. Commitment (20% total) — Attendance discipline (50%) + Delivery-deadline Reliability (40%) + Early-delivery bonus (10%).
  // Attendance is unrelated to leave requests (Annual/Sick/approved Late/approved Leave Early) — it's built purely from unauthorized late-arrival / early-departure hours the Team Lead logs manually.
  const unauthorizedHours = state.attendanceLogs.filter(a=>a.employeeId===empId && monthKeyInPeriod(a.month)).reduce((s,a)=>s+(Number(a.hours)||0),0);
  const attendanceScore = Math.max(0, 100 - unauthorizedHours*10);
  const netHours = isYtd
    ? employeeMonthlyTime(empId).filter(m=>monthKeyInPeriod(m.key)).reduce((s,m)=>s+m.netHours,0)
    : (employeeMonthlyTime(empId).find(m=>m.key===mKey)?.netHours || 0);
  // Reliability: meeting the deadline (on time OR early) = full marks — this measures "did they honor the commitment",
  // not how much margin they left. Late hours cost 4pts each, reaching 0 at 25h late (same tolerance as before).
  const reliabilityScore = Math.max(0, Math.min(100, 100 + Math.min(netHours,0)*4));
  // Early-delivery bonus: a small, SEPARATE incentive for building in buffer — deliberately kept out of Reliability
  // so on-time delivery is never penalized relative to early delivery. Zero at on-time-or-late, full marks at 25h+ early.
  const earlyBonusScore = Math.max(0, Math.min(100, netHours*4));
  const bufferingScore = reliabilityScore; // kept for anywhere else in the app that reads bufferingScore/netHours directly
  const timeScore = Math.round((attendanceScore*0.5) + (reliabilityScore*0.4) + (earlyBonusScore*0.1));

  // 2a. Quality of work — Domain 1 reviews. When a person has multiple reviews in-period, each one is weighted by
  // its task's estimated size (hours) — a 10-day deliverable pulls the average far more than a 1-hour meeting review,
  // so a small easy task can't drag down (or prop up) the score of someone whose real work this period was the big one.
  // Falls back to the all-time weighted avg only for the live current month when nothing's logged yet.
  const weightedQualityAvg = (revs)=>{
    let sumWeighted=0, sumWeight=0;
    revs.forEach(r=>{
      const relatedTask = state.tasks.find(t=>t.reviewId===r.id);
      const w = relatedTask? Math.max(taskEstimatedHours(relatedTask), 0.1) : 1; // tiny floor so a 0h task never zeroes out the weight
      sumWeighted += r.pct*w; sumWeight += w;
    });
    return sumWeight>0? sumWeighted/sumWeight : null;
  };
  const reviewsInPeriod = state.qualityReviews.filter(r=>r.employeeId===empId && inPeriod(r.date));
  const allReviews = state.qualityReviews.filter(r=>r.employeeId===empId);
  const qualityScore = reviewsInPeriod.length? weightedQualityAvg(reviewsInPeriod)
    : (isLiveCurrentMonth && allReviews.length? weightedQualityAvg(allReviews) : null);
  const hasQuality = qualityScore!=null;

  // 2b. Quality of work — Training Monitor hours, this period, normalized to 0-100 (4+ hours/month equivalent = full marks).
  // No hours logged at all this period = no data (weight redistributes below), not a scored zero.
  const monitoringHrs = state.monitoringLogs.filter(m=>m.employeeId===empId && inPeriod(m.date) && (m.status==='approved' || m.status===undefined)).reduce((s,m)=>s+(Number(m.hours)||0),0);
  const hasMonitoring = monitoringHrs>0;
  const MONITOR_FLOOR_HRS = 4, MONITOR_CEILING_HRS = 12;
  const monitorScore = !hasMonitoring ? null : (monitoringHrs<=MONITOR_FLOOR_HRS ? 0
    : monitoringHrs>=MONITOR_CEILING_HRS ? 100
    : ((monitoringHrs-MONITOR_FLOOR_HRS)/(MONITOR_CEILING_HRS-MONITOR_FLOOR_HRS))*100);

  // 2c. Quality of work — Client Satisfaction, this employee's own logged scores (1-5 stars -> 0-100).
  // No score logged this period = no data (weight redistributes below), not a scored zero.
  const satisfactionInPeriod = state.clientSatisfaction.filter(c=>c.employeeId===empId && inPeriod(c.date));
  const allSatisfaction = state.clientSatisfaction.filter(c=>c.employeeId===empId);
  const satisfactionRaw = satisfactionInPeriod.length? (satisfactionInPeriod.reduce((s,c)=>s+c.score,0)/satisfactionInPeriod.length)
    : (isLiveCurrentMonth && allSatisfaction.length? (allSatisfaction.reduce((s,c)=>s+c.score,0)/allSatisfaction.length) : null);
  const hasSatisfaction = satisfactionRaw!=null;
  const satisfactionScore = hasSatisfaction? (satisfactionRaw/5)*100 : null;

  // 2d. Quality of work — Delivery Compliance: how well the handoff steps (pack sent, trainer briefed, monitored...) were
  // followed for this period's live training deliveries. Only counts deliveries logged against this employee's own tasks.
  const deliveriesInPeriod = state.deliveries.filter(d=>d.employeeId===empId && inPeriod(d.date));
  const hasDelivery = deliveriesInPeriod.length>0;
  const deliveryScore = hasDelivery? deliveriesInPeriod.reduce((s,d)=>s+d.checkRate,0)/deliveriesInPeriod.length : null;

  // 3. Team recognition — High Fives received in-period (capped so a couple don't dominate the score)
  const highFives = state.shoutouts.filter(s=>s.toEmployeeId===empId && inPeriod(s.date)).length;
  const recognitionScore = Math.min(100, highFives*30);

  // 4. Growth & contribution — Stretch assignments completed + Innovation (New Methodology / Tool Pilot) completed, THIS PERIOD —
  // resets each month like every other component, so work from months ago doesn't keep inflating every future month's score.
  const stretchCount = tasksFor(empId).filter(t=>t.status==='done' && t.stretch && inPeriod(t.completedDate)).length;
  const innovationCount = tasksFor(empId).filter(t=>t.status==='done' && t.typeId==='tt9' && inPeriod(t.completedDate)).length;
  const growthScore = Math.min(100, stretchCount*10 + innovationCount*15);

  // 5. Effort delivered — total estimated hours of work actually completed this period, linear against a full working
  // month (160h = 20 days × 8h = 100). Separate from Quality on purpose: a big task and a small task scored the same
  // still show equal Quality, but the person who delivered more real hours earns more here — a distinct dimension.
  const EFFORT_TARGET_HOURS = 160;
  const hoursDelivered = tasksFor(empId).filter(t=>t.status==='done' && inPeriod(t.completedDate)).reduce((s,t)=>s+taskEstimatedHours(t),0);
  const effortScore = Math.min(100, (hoursDelivered/EFFORT_TARGET_HOURS)*100);

  // Quality of Work is 55% total: Domain 1 (25) + Delivery Compliance (20) + Training Monitor (5) + Client Satisfaction (5).
  // Whichever of the four has no data this period redistributes its weight proportionally across whatever IS present,
  // so nobody is unfairly zeroed out on a metric that simply doesn't have data yet — same rule for all four, consistently.
  const baseWeights = {time:0.20, recognition:0.05, growth:0.05, effort:0.15}; // always present — sums to 0.45
  const QUALITY_MAX = 0.25, DELIVERY_MAX = 0.20, MONITOR_MAX = 0.05, SATISFACTION_MAX = 0.05; // + baseWeights (0.45) = 1.00
  const presentWeights = {...baseWeights};
  let redistributePool = 0;
  if(hasQuality) presentWeights.quality = QUALITY_MAX; else redistributePool += QUALITY_MAX;
  if(hasDelivery) presentWeights.delivery = DELIVERY_MAX; else redistributePool += DELIVERY_MAX;
  if(hasMonitoring) presentWeights.monitor = MONITOR_MAX; else redistributePool += MONITOR_MAX;
  if(hasSatisfaction) presentWeights.satisfaction = SATISFACTION_MAX; else redistributePool += SATISFACTION_MAX;
  const presentSum = Object.values(presentWeights).reduce((s,v)=>s+v,0);
  const weights = {quality:0, delivery:0, monitor:0, satisfaction:0};
  Object.keys(presentWeights).forEach(k=> weights[k] = presentWeights[k] + (presentWeights[k]/presentSum)*redistributePool);

  const total = Math.round(
    timeScore*weights.time +
    (hasQuality?qualityScore:0)*weights.quality +
    (hasMonitoring?monitorScore:0)*weights.monitor +
    (hasSatisfaction?satisfactionScore:0)*weights.satisfaction +
    recognitionScore*weights.recognition +
    growthScore*weights.growth +
    effortScore*weights.effort +
    (hasDelivery?deliveryScore:0)*weights.delivery
  );

  // A single blended 0-100 "Quality of Work" figure — how much of that whole bucket they're earning, for a clean view
  const qualityBucketWeight = weights.quality + weights.monitor + weights.satisfaction + weights.delivery;
  const qualityOfWorkScore = qualityBucketWeight>0
    ? Math.round((((hasQuality?qualityScore:0)*weights.quality) + ((hasMonitoring?monitorScore:0)*weights.monitor) + ((hasSatisfaction?satisfactionScore:0)*weights.satisfaction) + ((hasDelivery?deliveryScore:0)*weights.delivery)) / qualityBucketWeight)
    : 0;

  return {
    total, weights, hasQuality, hasDelivery, hasMonitoring, hasSatisfaction,
    qualityOfWorkScore,
    timeScore: Math.round(timeScore), unauthorizedHours, attendanceScore: Math.round(attendanceScore), bufferingScore: Math.round(bufferingScore), reliabilityScore: Math.round(reliabilityScore), earlyBonusScore: Math.round(earlyBonusScore), netHours,
    qualityScore: hasQuality? Math.round(qualityScore) : null,
    monitorScore: hasMonitoring? Math.round(monitorScore) : null, monitoringHrs,
    satisfactionScore: hasSatisfaction? Math.round(satisfactionScore) : null, satisfactionRaw: satisfactionRaw!=null?Math.round(satisfactionRaw*10)/10:null,
    deliveryScore: hasDelivery? Math.round(deliveryScore) : null, deliveryCount: deliveriesInPeriod.length,
    recognitionScore: Math.round(recognitionScore), highFives,
    growthScore: Math.round(growthScore), stretchCount, innovationCount,
    effortScore: Math.round(effortScore), hoursDelivered: Math.round(hoursDelivered*10)/10,
  };
}
function heroesRanking(period){
  return state.employees.map(e=>({emp:e, score: computeHeroesScore(e.id, period)})).sort((a,b)=>b.score.total-a.score.total);
}
function computeEomCandidates(mKey){
  return heroesRanking().map(r=>{
    const monthly = employeeMonthlyTime(r.emp.id).find(m=>m.key===mKey);
    return {emp:r.emp, qualityAvg:r.score.qualityScore, netHours: monthly? monthly.netHours : 0, combined:r.score.total};
  })
    .filter(c=>c.qualityAvg!=null)
    .sort((a,b)=>b.combined-a.combined);
}

const WEEKLY_CAPACITY_HOURS = 40; // standard working week assumption, used to translate queued work into a workload signal
function taskEstimatedHours(t){
  const type = typeById(t.typeId);
  if(!type) return 0;
  const mode = (t.mode && taskTypeMode(type, t.mode)) || type.modes[0];
  const days = (mode && mode.days!=null) ? mode.days : 0;
  return days * HOURS_PER_DAY;
}
function employeeWorkloadHours(empId){
  return tasksFor(empId).filter(t=>t.status==='open').reduce((s,t)=>s+taskEstimatedHours(t),0);
}
function employeeWorkloadWeeks(empId){
  return employeeWorkloadHours(empId)/WEEKLY_CAPACITY_HOURS;
}
function workloadStatus(weeks){
  if(weeks>2) return {label:'Overloaded', cls:'neg'};
  if(weeks>1) return {label:'Busy', cls:'zero'};
  return {label:'Comfortable', cls:'pos'};
}

function computeWeekBuckets(n){
  const start0 = getWeekStart(todayStr());
  const weeks = [];
  for(let i=0;i<n;i++){
    const start = addDays(start0, i*7);
    const end = addDays(start, 6);
    const d = new Date(start+'T00:00:00');
    weeks.push({start, end, label: (i===0?'This wk':d.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))});
  }
  return weeks;
}
function tasksInWeek(empId, weekStart, weekEnd){
  return tasksFor(empId).filter(t=>t.status==='open' && t.deadline>=weekStart && t.deadline<=weekEnd);
}
function employeeLeaveHoursInWeek(empId, weekStart, weekEnd){
  const approved = state.requests.filter(r=>r.employeeId===empId && r.status==='approved');
  let hours = 0;
  approved.forEach(r=>{
    if(r.type==='annual_leave' || r.type==='sick'){
      const rStart = r.startDate, rEnd = r.endDate || r.startDate;
      const s = rStart > weekStart ? rStart : weekStart;
      const e = rEnd < weekEnd ? rEnd : weekEnd;
      if(s<=e) hours += businessDaysInclusive(s,e) * HOURS_PER_DAY;
    } else if(r.type==='leave_early' || r.type==='late'){
      if(r.startDate>=weekStart && r.startDate<=weekEnd) hours += Number(r.hours)||1;
    } else if(r.type==='worked_day_off'){
      // the compDate is the day off taken in exchange — reduces capacity that week
      if(r.compDate && r.compDate>=weekStart && r.compDate<=weekEnd) hours += HOURS_PER_DAY;
      // the startDate is the original day off they actually worked — adds capacity that week
      if(r.startDate>=weekStart && r.startDate<=weekEnd) hours -= HOURS_PER_DAY;
    }
  });
  return hours;
}
function employeeLeaveDaysInWeek(empId, weekStart, weekEnd){
  return employeeLeaveHoursInWeek(empId, weekStart, weekEnd) / HOURS_PER_DAY;
}
function employeeWeekCapacityHours(empId, weekStart, weekEnd){
  return Math.max(0, WEEKLY_CAPACITY_HOURS - employeeLeaveHoursInWeek(empId, weekStart, weekEnd));
}

function employeeStats(empId){
  const tasks = tasksFor(empId);
  const done = tasks.filter(t=>t.status==='done');
  const open = tasks.filter(t=>t.status==='open');
  const stretchCount = done.filter(t=>t.stretch).length;
  const onTime = done.filter(t=>computeTaskHoursDiff(t)>=0).length;
  const late = done.filter(t=>computeTaskHoursDiff(t)<0).length;
  const onTimeRate = done.length? Math.round((onTime/done.length)*100) : null;
  const monthlyTime = employeeMonthlyTime(empId);
  const curKey = monthKey(todayStr());
  const curRec = monthlyTime.find(m=>m.key===curKey);
  const currentMonthNet = curRec? curRec.netHours : 0;
  const allTimeNetHours = Math.round(monthlyTime.reduce((s,m)=>s+m.netHours,0)*10)/10;
  const reviews = state.qualityReviews.filter(r=>r.employeeId===empId);
  const qualityAvg = reviews.length? Math.round(reviews.reduce((s,r)=>s+r.pct,0)/reviews.length) : null;
  return {tasks, done, open, stretchCount, onTime, late, onTimeRate, monthlyTime, currentMonthNet, allTimeNetHours, totalCount:tasks.length, reviews, qualityAvg};
}

function authEmailFor(username){ return username.trim().toLowerCase()+'@skillsbank.local'; }
async function createAuthAccount(username, password, role, employeeId){
  const email = authEmailFor(username);
  const { data, error } = await sbClient.auth.signUp({ email, password });
  if(error || !data.user) return {ok:false, error};
  const { error: profErr } = await sbClient.from('profiles').insert({ id:data.user.id, role, employee_id: employeeId||null, username });
  if(profErr) return {ok:false, error:profErr};
  return {ok:true};
}
async function migrateToSecureLogin(){
  if(state.authMigrated){ showToast('Already migrated'); return; }
  if(!confirm('Before continuing: in your Supabase project, go to Authentication > Providers > Email and turn OFF "Confirm email". Have you done that? Click OK to proceed, or Cancel to check first.')) return;
  const accountsToMigrate = [
    {username: state.accounts.admin.username, password: state.accounts.admin.password, role:'admin'},
    {username: state.accounts.teamlead.username, password: state.accounts.teamlead.password, role:'teamlead'},
    ...(state.accounts.ldmanager? [{username: state.accounts.ldmanager.username, password: state.accounts.ldmanager.password, role:'ldmanager'}] : []),
    ...state.employees.filter(e=>e.username && e.password).map(e=>({username:e.username, password:e.password, role:'employee', employeeId:e.id})),
  ];
  let okCount=0, failCount=0;
  for(const acc of accountsToMigrate){
    const res = await createAuthAccount(acc.username, acc.password, acc.role, acc.employeeId);
    if(res.ok) okCount++; else { failCount++; console.error('Migration failed for', acc.username, res.error); }
  }
  if(okCount>0){
    state.authMigrated = true;
    logActivity(`Migrated ${okCount} account(s) to secure login${failCount?`, ${failCount} failed — see console`:''}`);
    await saveData();
  }
  try{ await sbClient.auth.signOut(); }catch(e){}
  showToast(`Migration finished — ${okCount} succeeded, ${failCount} failed. Please log back in.`);
  await clearSession();
}
function checkLoginLegacy(username, password){
  const acc = state.accounts;
  if(username===acc.admin.username && password===acc.admin.password) return {role:'admin'};
  if(username===acc.teamlead.username && password===acc.teamlead.password) return {role:'teamlead'};
  if(acc.ldmanager && username===acc.ldmanager.username && password===acc.ldmanager.password) return {role:'ldmanager'};
  const emp = state.employees.find(e=>e.username && e.username===username && e.password===password);
  if(emp) return {role:'employee', employeeId:emp.id};
  return null;
}
async function checkLoginSecure(username, password){
  const email = authEmailFor(username);
  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  if(error || !data || !data.user) return null;
  const { data: profile } = await sbClient.from('profiles').select('*').eq('id', data.user.id).single();
  if(!profile) return null;
  return profile.role==='employee' ? {role:'employee', employeeId:profile.employee_id} : {role:profile.role};
}
async function checkLogin(username, password){
  if(!username || !password) return null;
  if(!state.authMigrated) return checkLoginLegacy(username, password); // secure login isn't set up yet — skip the network round-trip that would only fail
  const secure = await checkLoginSecure(username, password);
  if(secure) return secure;
  return checkLoginLegacy(username, password);
}

function bindLoginEvents(){
  const doLogin = async ()=>{
    loginState.error='';
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value;
    const result = await checkLogin(u,p);
    if(result){
      session = result;
      await saveSession();
      await loadData();
      renderApp();
    } else { loginState.error = 'Incorrect username or password'; renderApp(); }
  };
  const btnLogin = document.getElementById('btn-login');
  if(btnLogin) btnLogin.onclick = doLogin;
  const pwField = document.getElementById('login-password');
  if(pwField) pwField.onkeydown = (ev)=>{ if(ev.key==='Enter') doLogin(); };
}

function hashString(s){
  let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
  return h;
}
function dayOfYear(){
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  return Math.floor((now - start) / 86400000);
}
function getDailyQuote(seedKey){
  const idx = (dayOfYear() + hashString(seedKey||'')) % DAILY_QUOTES.length;
  return DAILY_QUOTES[idx];
}
function currentDisplayName(){
  if(!session) return '';
  if(session.role==='employee'){
    const e = employeeById(session.employeeId);
    return e? e.name.split(' ')[0] : 'there';

  const username = session.role==='admin'? state.accounts.admin.username
    : session.role==='ldmanager'? (state.accounts.ldmanager && state.accounts.ldmanager.username)
    : state.accounts.teamlead.username;
  const name = username || 'there';
  return name.charAt(0).toUpperCase()+name.slice(1);
}

let mgrBriefDeltaCache = null; // {lastVisit, sinceLog} — computed once per page visit, not on every re-render
function computeManagerBrief(){
  const today = todayStr();
  const mKey = monthKey(today); // the real current month — used for EOM/shoutouts/attention, which are live-decision items, not historical browsing
  const mf = getMonthFilter('managerbrief'); // the selected browsing period — used for the period KPIs below

  const reviewsInScope = state.qualityReviews.filter(r=>inMonthFilter(r.date, mf));
  const qualityAvgThisMonth = reviewsInScope.length ? Math.round(reviewsInScope.reduce((s,r)=>s+r.pct,0)/reviewsInScope.length) : null;

  const doneThisMonth = state.tasks.filter(t=>t.status==='done' && t.completedDate && inMonthFilter(t.completedDate, mf));
  const onTimeRateThisMonth = doneThisMonth.length ? Math.round((doneThisMonth.filter(t=>computeTaskHoursDiff(t)>=0).length/doneThisMonth.length)*100) : null;

  const thisWeek = computeWeekBuckets(1)[0];
  const wkHours = state.employees.reduce((s,e)=> s + tasksInWeek(e.id, thisWeek.start, thisWeek.end).reduce((s2,t)=>s2+taskEstimatedHours(t),0), 0);
  const wkCapacity = state.employees.reduce((s,e)=> s + employeeWeekCapacityHours(e.id, thisWeek.start, thisWeek.end), 0);
  const workloadPct = wkCapacity>0 ? Math.round((wkHours/wkCapacity)*100) : (wkHours>0?100:0);

  const auditsInScope = state.complianceAudits.filter(a=>inMonthFilter(`${a.year}-${String(a.month).padStart(2,'0')}-01`, mf));
  const latestAudit = auditsInScope.slice().sort((a,b)=>new Date(b.year,b.month)-new Date(a.year,a.month))[0] || null;

  const severityOrder = {IMMEDIATE:0,URGENT:1,STANDARD:2,SCHEDULED:3};
  const triggers = computeTriggers().sort((a,b)=>severityOrder[a.severity]-severityOrder[b.severity]);
  const topTrigger = triggers[0] || null;

  const confirmedEom = state.employeeOfMonth.find(x=>x.monthKey===mKey);
  let eomEmp=null, eomQuality=null, eomScore=null, eomConfirmed=false;
  if(confirmedEom){
    eomEmp = employeeById(confirmedEom.employeeId);
    if(eomEmp){ const s = computeHeroesScore(eomEmp.id); eomQuality = s.qualityScore; eomScore = s.total; eomConfirmed = true; }
  } else {
    const top = computeEomCandidates(mKey)[0];
    if(top){ eomEmp = top.emp; eomQuality = top.qualityAvg; eomScore = top.combined; }
  }
  const shoutoutsThisMonth = state.shoutouts.filter(s=>monthKey(s.date)===mKey).length;

  const last30 = addDays(today, -30);
  const attention = [];
  state.employees.forEach(e=>{
    const reasons = [];
    const overdueCount = tasksFor(e.id).filter(t=>t.status==='open' && dayDiff(t.deadline, today) < 0).length;
    if(overdueCount>0) reasons.push(`${overdueCount} overdue task${overdueCount===1?'':'s'}`);
    const pauseCount = tasksFor(e.id).reduce((s,t)=>s+(t.pauseLog||[]).filter(p=>p.from>=last30).length, 0);
    if(pauseCount>=2) reasons.push(`${pauseCount} pauses in the last 30 days`);
    const empReviews = state.qualityReviews.filter(r=>r.employeeId===e.id).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
    if(empReviews.length && empReviews[0].pct<70) reasons.push(`latest quality review ${empReviews[0].pct}%`);
    if(reasons.length) attention.push({emp:e, reasons});
  });

  const trendMonths = [];
  for(let i=5;i>=0;i--){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const label = d.toLocaleDateString('en-GB',{month:'short'});
    const revs = state.qualityReviews.filter(r=>monthKey(r.date)===k);
    const qAvg = revs.length ? Math.round(revs.reduce((s,r)=>s+r.pct,0)/revs.length) : null;
    const done = state.tasks.filter(t=>t.status==='done' && t.completedDate && monthKey(t.completedDate)===k);
    const onTime = done.length ? Math.round((done.filter(t=>computeTaskHoursDiff(t)>=0).length/done.length)*100) : null;
    trendMonths.push({key:k, label, qAvg, onTime});
  }

  const scorecard = state.employees.map(e=>{
    const revs = state.qualityReviews.filter(r=>r.employeeId===e.id);
    const qAvg = revs.length ? Math.round(revs.reduce((s,r)=>s+r.pct,0)/revs.length) : null;
    const done = tasksFor(e.id).filter(t=>t.status==='done');
    const onTime = done.length ? Math.round((done.filter(t=>computeTaskHoursDiff(t)>=0).length/done.length)*100) : null;
    return {emp:e, qAvg, onTime, workloadHours: employeeWorkloadHours(e.id)};
  });

  if(mgrBriefDeltaCache===null){
    const storageKey = 'mgrBriefLastVisit_'+(session?session.role:'anon');
    let lastVisit = null, sinceLog = [];
    try{
      lastVisit = localStorage.getItem(storageKey);
      sinceLog = lastVisit ? state.auditLog.filter(l=>l.ts>lastVisit).slice(-8).reverse() : [];
      localStorage.setItem(storageKey, new Date().toISOString());
    }catch(e){}
    mgrBriefDeltaCache = {lastVisit, sinceLog};
  }

  return {mf, qualityAvgThisMonth, onTimeRateThisMonth, workloadPct, latestAudit, topTrigger, eomEmp, eomQuality, eomScore, eomConfirmed, shoutoutsThisMonth, attention, trendMonths, scorecard, lastVisit: mgrBriefDeltaCache.lastVisit, sinceLog: mgrBriefDeltaCache.sinceLog};
}
function exportManagerBriefCSV(){
  const b = computeManagerBrief();
  const rows = [
    ['Manager Brief', fmtDate(todayStr())],
    [],
    ['Quality avg (this month)', b.qualityAvgThisMonth==null?'':b.qualityAvgThisMonth+'%'],
    ['On-time rate (this month)', b.onTimeRateThisMonth==null?'':b.onTimeRateThisMonth+'%'],
    ['Team workload (this week)', b.workloadPct+'%'],
    ['Latest compliance audit', b.latestAudit? b.latestAudit.overallPct+'%' : ''],
    ['Top alert', b.topTrigger? `${b.topTrigger.severity} — ${b.topTrigger.text}` : 'None'],
    ['Employee of the Month', b.eomEmp? `${b.eomEmp.name} (${b.eomConfirmed?'confirmed':'suggested'}) — Quality ${b.eomQuality}% · Heroes Score ${b.eomScore}` : ''],
    ['Shoutouts this month', b.shoutoutsThisMonth],
    [],
    ['Needs attention', ''],
    ...b.attention.map(a=>[a.emp.name, a.reasons.join('; ')]),
    [],
    ['Team scorecard', ''],
    ['Name','Role','Quality avg','On-time rate','Current workload (hours)'],
    ...b.scorecard.map(s=>[s.emp.name, s.emp.role||'', s.qAvg==null?'':s.qAvg+'%', s.onTime==null?'':s.onTime+'%', Math.round(s.workloadHours*10)/10]),
  ];
  downloadFile(`manager-brief-${todayStr()}.csv`, toCSV(rows), 'text/csv');
}

        <div style="display:flex;gap:14px;align-items:flex-start">
          <div class="badge-ic">📢</div>
          <div>
            <div style="font-weight:700;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);margin-bottom:5px">Team Announcement</div>
            <div style="font-size:14.5px;line-height:1.6;white-space:pre-wrap">${escapeHtml(a.text)}</div>
            <div style="font-size:11.5px;color:var(--text-dim);margin-top:10px">— ${escapeHtml(a.authorLabel)} · ${fmtDateTime(a.createdAt)}</div>
          </div>
        </div>
        ${canManage? `<button class="btn btn-ghost btn-sm" id="btn-clear-announcement">Clear</button>` : ''}
      </div>
    </div>
  </div>`;
}
function renderAnnouncementComposer(){
  if(!(session && (session.role==='admin' || session.role==='teamlead'))) return '';
  return `<div class="card" style="margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><h3 style="margin:0">📢 Team announcement</h3><p class="hint" style="margin:2px 0 0">Shown to the whole team at the top of the Dashboard until cleared.</p></div>
      <button class="btn btn-ghost btn-sm" id="btn-toggle-announcement">${ui.showAnnouncementForm?'Close':(state.announcement?'Edit / replace':'+ Post an announcement')}</button>
    </div>
    ${ui.showAnnouncementForm? `
      <div style="margin-top:14px">
        <textarea id="announcement-text" rows="3" placeholder="Write something everyone on the team will see...">${escapeHtml(taVal('announcement-text', state.announcement?state.announcement.text:''))}</textarea>
        <div class="form-actions" style="margin-top:8px">
          <button class="btn btn-primary btn-sm" id="btn-save-announcement">Post to everyone</button>
          <button class="btn btn-ghost btn-sm" id="btn-cancel-announcement">Cancel</button>
        </div>
      </div>
    ` : ''}
  </div>`;
}
function teamMonthNetFor(mKey){
  if(mKey==='all') return state.employees.reduce((s,e)=> s + employeeMonthlyTime(e.id).reduce((s2,m)=>s2+m.netHours,0), 0);
  return state.employees.reduce((s,e)=>{
    const rec = employeeMonthlyTime(e.id).find(m=>m.key===mKey);
    return s + (rec? rec.netHours : 0);
  }, 0);
}
